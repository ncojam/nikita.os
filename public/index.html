<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nikita.os</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="desktop">
    <div id="wallpaper"></div>
    <div id="icons"></div>
    <div id="windows"></div>
  </div>

  <div id="start-menu" class="glass" hidden>
    <div class="sm-title">nikita.os</div>
    <button data-open="/home/nikita">🏠 Домашняя папка</button>
    <button data-open="/home/nikita/Projects">📁 Projects</button>
    <button data-app="settings">⚙️ Настройки</button>
    <button data-app="about">ℹ️ О системе</button>
  </div>

  <div id="taskbar" class="glass">
    <button id="start-btn" class="tb-btn" title="Меню">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
    </button>
    <button id="arrange-btn" class="tb-btn" title="Разложить окна по сетке" aria-label="Разложить окна">
      <svg class="stroke" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/></svg>
    </button>
    <div id="task-list"></div>
    <button id="fs-btn" class="tb-btn" title="Полный экран" aria-label="Полный экран">
      <svg id="fs-enter" class="stroke" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <svg id="fs-exit" class="stroke" viewBox="0 0 24 24" hidden><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
    </button>
    <div id="clock"></div>
  </div>

  <script src="js/core/overlay-core.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
