<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Clown Dungeon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg: #0d0b12; --panel: #1a1622; --line: #352c44; --text: #ece6f5; --dim: #9a90ad; --accent: #ff9ecf; --gold: #ffd76a; --good: #8fe8cf; --bad: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  body { background: var(--bg); color: var(--text); font: 15px/1.35 system-ui, sans-serif; }
  #app { height: var(--tg-viewport-stable-height, 100dvh); display: flex; flex-direction: column; padding: 10px 12px; gap: 8px; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; touch-action: manipulation; }
  button:active:not(:disabled) { background: var(--line); }
  button:disabled { opacity: .4; }
  button.main { background: var(--accent); border-color: var(--accent); color: #2b0d1e; font-weight: 700; }
  button.walk { position: relative; overflow: hidden; background: var(--panel); color: var(--text); }
  button.walk:active:not(:disabled) { background: var(--panel); }
  button.walk i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--accent); }
  button.walk span { position: relative; }
  button.walk.ready { color: #2b0d1e; }
  button.walk.queued span::after { content: " ▸"; }
  button.small { padding: 5px 9px; font-size: 13px; }
  .top { display: flex; align-items: center; gap: 10px; }
  .top .place { font-weight: 700; flex: 1; }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--good); transition: width .25s; }
  .bar.low i { background: var(--bad); }
  .bar.mp i { background: #7fa8ff; }
  .top > div { white-space: nowrap; font-size: 14px; }
  .top .hp { width: 76px; font-size: 11px; }
  .vitals { display: flex; gap: 10px; }
  .vitals .hp { flex: 1; width: auto; }
  .fx { font-size: 12px; color: #9fd3ff; }
  .hp { width: 110px; font-size: 12px; color: var(--dim); }
  .log { flex: 1; min-height: 0; overflow-y: auto; background: var(--panel); border-radius: 8px; padding: 8px 10px; font-size: 14px; display: flex; flex-direction: column; gap: 3px; user-select: text; -webkit-user-select: text; }
  .log div:last-child { color: var(--text); }
  .log div { color: var(--dim); }
  .row { display: flex; gap: 8px; }
  .row > button { flex: 1; }
  .list { display: flex; flex-direction: column; gap: 5px; max-height: 32dvh; overflow-y: auto; }
  .card { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 8px; padding: 6px 9px; font-size: 14px; }
  .card span { flex: 1; min-width: 0; }
  .card small { color: var(--dim); }
  .here { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  canvas { flex: 1; min-height: 0; width: 100%; display: block; border-radius: 8px; background: #120f19; touch-action: none; }
  .blog { height: 74px; overflow: hidden; font-size: 13px; color: var(--dim); display: flex; flex-direction: column; justify-content: flex-end; }
  .blog div:last-child { color: var(--text); }
  .card.border { border: 1px solid var(--gold); }
  .sheet { position: fixed; inset: 0; z-index: 5; background: rgba(5, 3, 8, .72); display: flex; flex-direction: column; justify-content: flex-end; }
  .sheet > div { background: var(--bg); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0; padding: 12px; display: flex; flex-direction: column; gap: 6px; max-height: 80dvh; overflow-y: auto; }
  .sheet h3 { margin: 0 0 2px; font-size: 15px; }
  .banner { position: fixed; left: 50%; top: 34%; transform: translateX(-50%); z-index: 6; background: var(--gold); color: #2b1d00; font-weight: 700; border-radius: 10px; padding: 10px 18px; pointer-events: none; white-space: nowrap; }
  .audio-info { font-size: 11px; color: var(--dim); display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .sound { font-size: 12px; color: var(--gold); text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/js/apps/dungeon/index.js"></script>
</body>
</html>
