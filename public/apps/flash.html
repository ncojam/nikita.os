<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Flash</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  ruffle-player { width: 100%; height: 100%; display: block; }
</style>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    letterbox: "on",
    contextMenu: "rightClickOnly",
    splashScreen: false,
    publicPath: "/vendor/ruffle/",
  };
</script>
<script src="/vendor/ruffle/ruffle.js"></script>
</head>
<body>
<script>
  // только флешки из своей fs: чужой swf на нашем origin ходил бы в API с cookie посетителя
  const swfParam = new URLSearchParams(location.search).get("swf") || "";
  let swfUrl = null;
  try { swfUrl = new URL(swfParam, location.origin); } catch (e) {}
  if (!swfUrl || swfUrl.origin !== location.origin || !swfUrl.pathname.startsWith("/fs/")) {
    document.body.textContent = "Можно открывать только флешки с этого сайта.";
    throw new Error("swf not allowed: " + swfParam);
  }
  const swf = swfUrl.pathname + swfUrl.search;
  const player = window.RufflePlayer.newest().createPlayer();
  document.body.append(player);
  // base — чтобы игра находила соседние файлы (подгружаемые swf, xml) рядом с собой
  player.load({ url: swf, base: swfUrl.pathname.replace(/[^/]*$/, "") });

  addEventListener("message", e => {
    if (e.origin !== location.origin || e.data?.type !== "flash") return;
    if (e.data.cmd === "pause")  player.suspend?.();
    if (e.data.cmd === "resume") player.resume?.();
  });
</script>
</body>
</html>
