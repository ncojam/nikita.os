<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Джус</title>
<link rel="stylesheet" href="/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--tg-theme-bg-color, #0c0f18); color: var(--tg-theme-text-color, #e8ecf5); }
  #app { height: var(--tg-viewport-stable-height, 100vh); }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { mountAirHockey } from "/js/apps/airhockey.js";
  const tg = window.Telegram?.WebApp;
  // без requestFullscreen: обычное окно Mini App, а не во весь экран
  try { tg.ready(); tg.expand(); tg.disableVerticalSwipes?.(); } catch {}
  const app = document.getElementById("app");
  mountAirHockey(app, { node: app }, { tg: { initData: tg?.initData || "" } });
</script>
</body>
</html>
