<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENDLESS MC SERVER</title>
<style>
:root{--top:#45237a;--mid:#1d0f33;--bot:#000;--rim:#5b2a9a;--teal:#2fd6d0;--txt:#a07ae0;--dim:#4f6b5d;
      --good:#5dff9a;--fake:#9ff06a;--bad:#c9a6ff;--glow:var(--rim)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--top) 0%,var(--mid) 55%,var(--bot) 100%)}
canvas#waves{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1fr 280px}
#stage{position:relative;display:flex;align-items:center;justify-content:center}
#typed{position:absolute;left:4%;top:20%;max-width:280px;font-size:18px;line-height:1.35;transform:rotate(-2deg);
  white-space:pre-wrap;min-height:4em;text-shadow:0 0 8px #0006}
#typed.bad{color:#d9c2ff}
#typed.big{font-size:44px;line-height:1.05;font-weight:900;max-width:min(560px,46vw);letter-spacing:-.01em;text-transform:uppercase;
  color:#e7d6ff;text-shadow:0 0 14px #c9a6ff88,0 4px 0 #0008;transform:rotate(-3deg)}
@media (max-width:760px){#typed.big{font-size:28px;max-width:90vw}}
#typed::after{content:"▌";animation:blink 1s steps(1) infinite;opacity:.7}
@keyframes blink{50%{opacity:0}}

#cubeHolder{position:relative;display:flex;flex-direction:column;align-items:center}
#cubeWrap{animation:levitate 12s ease-in-out infinite;position:relative;z-index:1}
@keyframes levitate{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(.5deg)}}
#floorShadow{width:300px;height:46px;margin-top:-8px;border-radius:50%;
  background:radial-gradient(ellipse at center,#000c 0%,#0007 40%,transparent 72%);filter:blur(6px);
  animation:shadow 12s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(.8);opacity:.6}}

#cube{position:relative;width:340px;height:396px;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#cube svg{width:100%;height:100%;overflow:visible;display:block}
/* подложка: отпускание медленное, удар — быстрый с перелётом */
#plate{transform-box:fill-box;transform-origin:center;
  transition:transform 1.1s cubic-bezier(.3,0,.2,1),filter 1s,fill .8s}
#plateRim{transition:stroke .8s}
#cube:hover #plate{transform:scale(1.04)}
#cube.on #plate{transform:scale(1.3);transition:transform .32s cubic-bezier(.2,2.4,.35,1),filter .2s,fill .2s;
  filter:drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 34px var(--glow)) drop-shadow(0 0 70px var(--glow))}
#cube.on #plateRim{stroke:var(--glow);transition:stroke .2s}
#cube.on #plateFill{fill:color-mix(in srgb,var(--glow) 30%,#1a0c30)}
/* камень светится еле-еле */
#stone{transition:filter 1s}
#cube.on #stone{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--glow) 60%,transparent))}
#inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#inner img{position:absolute;width:56%;image-rendering:pixelated;opacity:.85}
.tag{position:relative;transform:rotate(-6deg);color:var(--teal);font-size:16px;line-height:1.35;text-align:left;
  letter-spacing:.04em;text-shadow:0 0 6px #2fd6d055}
.shake{animation:shake .8s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px) rotate(-2deg)}40%,60%{transform:translate(7px,-3px) rotate(2deg)}}

#list{border-left:2px solid var(--teal);padding:100px 14px 20px;overflow-y:auto;font-family:"Courier New",monospace;font-size:10px;color:var(--dim)}
#list h3{margin:0 0 14px;font-size:10px;letter-spacing:.3em;font-weight:normal;color:#8aa}
#list ul{margin:0;padding:0}
#list li{list-style:none;padding:2px 0;word-break:break-all}
#list li.me{color:var(--good)}
#emailBox{position:fixed;bottom:18px;left:calc((100% - 280px)/2);transform:translateX(-50%);z-index:2}
#email{width:240px;background:transparent;border:1px solid #ffffff12;color:#aaa;padding:8px 10px;font:inherit;font-size:12px;outline:none;transition:border-color .6s}
#email:focus{border-color:#ffffff26}
#email::placeholder{color:#ffffff22}
#email.ok{border-color:#5dff9a33}
#email.err{border-color:#ff8a8a33}
#cube.locked{cursor:wait}
#choice{position:absolute;left:4%;top:calc(20% + 220px);display:flex;gap:12px;z-index:3}
#choice[hidden]{display:none}
#choice button{background:#0005;color:#e7d6ff;border:1px solid #c9a6ff66;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;
  letter-spacing:.06em;transition:background .2s,border-color .2s}
#choice button:hover{background:#c9a6ff22;border-color:#c9a6ff}
#counters{position:absolute;left:4%;bottom:70px;display:flex;flex-direction:column;gap:14px;z-index:2}
.ctr[hidden]{display:none}
.ctr .lbl{font:10px "Courier New",monospace;letter-spacing:.3em;color:#8a7aa8;margin-bottom:5px}
.seg{display:flex;gap:6px;padding:8px 10px;background:#05020a;border:1px solid #2a1846;border-radius:4px;box-shadow:inset 0 0 12px #000}
.dg{position:relative;width:18px;height:32px}
.dg i{position:absolute;background:var(--c);opacity:.07;border-radius:2px;transition:opacity .08s}
.dg i.on{opacity:1;box-shadow:0 0 6px var(--c)}
.dg i:nth-child(1){left:3px;top:0;width:12px;height:3px}.dg i:nth-child(2){right:0;top:3px;width:3px;height:12px}
.dg i:nth-child(3){right:0;top:17px;width:3px;height:12px}.dg i:nth-child(4){left:3px;bottom:0;width:12px;height:3px}
.dg i:nth-child(5){left:0;top:17px;width:3px;height:12px}.dg i:nth-child(6){left:0;top:3px;width:3px;height:12px}
.dg i:nth-child(7){left:3px;top:14.5px;width:12px;height:3px}
#ctrN{--c:#ff6a3c}#ctrF{--c:#9ff06a}
@media (max-width:760px){#choice{top:auto;bottom:40%}#counters{bottom:56px}.dg{width:12px;height:22px}}
#diaryBtn{position:absolute;right:16px;top:16px;z-index:3;background:#0004;color:#c9a6ff;border:1px solid #c9a6ff44;
  font:600 11px "Courier New",monospace;letter-spacing:.2em;padding:7px 12px;cursor:pointer;animation:pulseIn 1.2s ease-out}
#diaryBtn[hidden]{display:none}
@keyframes pulseIn{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
#diary{position:fixed;inset:0;z-index:10;background:#05020ccc;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center}
#diary[hidden]{display:none}
#diary .book{width:min(560px,92vw);max-height:80vh;overflow-y:auto;background:#120824;border:1px solid #3a1c66;padding:22px 24px;box-shadow:0 20px 60px #000}
#diary h2{margin:0 0 4px;font:900 22px inherit;font-family:inherit;color:#e7d6ff;letter-spacing:.08em}
#diary .sub{font:11px "Courier New",monospace;color:#7a6a98;margin-bottom:16px}
#diary ol{margin:0;padding:0 0 0 22px;color:#5a4a78;font-size:14px}
#diary li{padding:6px 0;border-bottom:1px solid #ffffff08}
#diary li b{color:#e7d6ff;font-weight:700}#diary li span{display:block;color:#9a88c0;font-size:12px;margin-top:2px}
#diary li.dark b,#diary li.dark span{color:transparent;background:#000;border-radius:2px;user-select:none}
#diary .close{float:right;background:none;border:0;color:#9a88c0;font-size:20px;cursor:pointer}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-80px);z-index:9;background:#120824;border:1px solid #9ff06a66;
  color:#d9ffc0;font:600 12px "Courier New",monospace;letter-spacing:.12em;padding:8px 14px;transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
#toast.show{transform:translateX(-50%) translateY(0)}
#reset{position:fixed;top:10px;left:10px;z-index:3;background:#0006;color:#f9a;border:1px dashed #f9a6;font:11px monospace;padding:4px 8px;cursor:pointer}
#cube.bad.on #plate{filter:drop-shadow(0 0 8px var(--glow)) drop-shadow(0 0 24px var(--glow))}
#cube.bad #plate{transition:transform 2.4s cubic-bezier(.2,0,.1,1),filter 2.4s,fill 2s}
#cube.bad #plateRim,#cube.bad #stone{transition:stroke 2.2s,filter 2.2s}
.shake.bad{animation-duration:.35s}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 150px}
  #list{border-left:0;border-top:2px solid var(--teal);padding-top:14px}#typed{top:6%;font-size:15px}
  #cube{width:240px;height:280px}#emailBox{left:50%}}
</style>
</head>
<body>
<canvas id="waves"></canvas>
<main>
  <section id="stage">
    <div id="typed"></div>
    <div id="choice" hidden></div>
    <div id="counters">
      <div class="ctr" id="ctrNBox" hidden><div class="lbl">PRESSES</div><div class="seg" id="ctrN"></div></div>
      <div class="ctr" id="ctrFBox" hidden><div class="lbl">FAKE GREENS</div><div class="seg" id="ctrF"></div></div>
    </div>
    <div id="cubeHolder"><div id="cubeWrap"><button id="cube" aria-label="press">
      <svg viewBox="0 0 240 280">
        <defs>
          <linearGradient id="stoneG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160a28"/><stop offset="1" stop-color="#0a0514"/></linearGradient>
        </defs>
        <g id="plate"><path id="plateFill" fill="#1a0c30"/><path id="plateRim" fill="none" stroke="var(--rim)" stroke-width="5"/></g>
        <g id="stone"><path id="stoneFill" fill="url(#stoneG)" stroke="#3a1c66" stroke-width="2"/></g>
      </svg>
      <div id="inner">
        <img src="/endless/cube.png" alt="" onerror="this.remove()">
        <div class="tag">ENDLESS MC SERVER<br>ENDLESS DIRECTIONS<br>ENDLESS POSSIBILITIES</div>
      </div>
    </button></div><div id="floorShadow"></div></div>
  </section>
  <button id="diaryBtn" hidden>ДНЕВНИК</button>
  <aside id="list"><h3>REGISTERED</h3><ul id="ul"></ul></aside>
</main>
<button id="reset" hidden>TEST: стереть мою регистрацию</button>
<div id="diary" hidden><div class="book"><button class="close" aria-label="close">×</button>
  <h2>ДНЕВНИК СЕКРЕТОВ</h2><div class="sub" id="diarySub"></div><ol id="diaryList"></ol></div></div>
<div id="toast"></div>
<div id="emailBox"><input id="email" type="email" placeholder="e-mail" autocomplete="email" maxlength="254"></div>

<script>
const API='/api/endless/press', SALT='endless-v1';
const $=s=>document.querySelector(s);
const cube=$('#cube'), typed=$('#typed'), ul=$('#ul'), root=document.documentElement, holder=$('#cubeHolder');

/* ---------- шестиугольник со скруглёнными углами ---------- */
const HEX=[[0,-128],[102,-74],[102,74],[0,128],[-102,74],[-102,-74]]; // относительно центра 120,140
function roundedHex(scale,r){
  const P=HEX.map(([x,y])=>[120+x*scale,140+y*scale]);let d='';
  P.forEach((p,i)=>{const a=P[(i+5)%6],b=P[(i+1)%6];
    const u=(q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy);return [p[0]+dx/l*r,p[1]+dy/l*r]};
    const s=u(a),e=u(b);d+=(i?'L':'M')+s[0].toFixed(1)+' '+s[1].toFixed(1)+'Q'+p[0]+' '+p[1]+' '+e[0].toFixed(1)+' '+e[1].toFixed(1)});
  return d+'Z';
}
$('#plateFill').setAttribute('d',roundedHex(1,22));$('#plateRim').setAttribute('d',roundedHex(1,22));
$('#stoneFill').setAttribute('d',roundedHex(.84,18));

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- хранилища ---------- */
const LS={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const SS={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}}};
const CK={get:k=>(document.cookie.match('(?:^|; )'+k+'=([^;]*)')||[])[1]||null,set:(k,v)=>document.cookie=`${k}=${v};max-age=31536000;path=/;SameSite=Lax`};
function idb(){return new Promise(r=>{try{const q=indexedDB.open('emc',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}})}
async function IDB_get(k){const d=await idb();if(!d)return null;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)})}
async function IDB_set(k,v){const d=await idb();if(d)d.transaction('kv','readwrite').objectStore('kv').put(v,k)}
async function writeMarks(sig){LS.set('emc_sig',sig);CK.set('_ga_mc',sig);await IDB_set('sig',sig)}

/* ---------- сервер (мок, если API нет) ---------- */
async function server(action,value){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,value})});
    if(!r.ok)throw 0;return await r.json();
  }catch{
    let ip=await IDB_get('mock_ip');if(!ip){ip=crypto.randomUUID();await IDB_set('mock_ip',ip)}
    const h=await sha(await sha(ip+SALT)+SALT),m=JSON.parse(await IDB_get('mock')||'{"list":[],"fake":false}');
    const known=m.list.includes(h);
    if(action==='register'&&!known)m.list.unshift(h);
    m.n=m.n||0;m.f=m.f||0;
    if(known&&action==='fake'){m.fake=true;m.f++}if(action==='unfake')m.fake=false;
    if(known&&action==='gamefake'&&m.mode==='game')m.f++;
    if(known&&action==='tap'&&m.mode==='game')m.n++;
    if(known&&action==='mode'){m.mode=value==='game'?'game':null;m.fake=false}
    if(known&&action==='c2')m.c2=!!value;
    m.sec=m.sec||[];if(known&&action==='secret'&&!m.sec.includes(value))m.sec.push(value);
    await IDB_set('mock',JSON.stringify(m));
    return {known,fake:m.fake,uaSame:true,me:h,list:m.list,n:m.n,f:m.f,mode:m.mode||null,c2:!!m.c2,sec:m.sec};
  }
}

/* ---------- звуки ---------- */
const snd={};  // имя -> url первого существующего файла
(async()=>{for(const n of ['good','fake','bad'])for(const ext of ['ogg','mp3','wav']){
  const url=`/endless/sounds/${n}.${ext}`;
  try{const r=await fetch(url,{method:'HEAD',cache:'no-store'});if(r.ok){snd[n]=url;new Audio(url).preload='auto';break}}catch{}
}console.log('[endless] звуки:',snd)})();
function play(n){if(!snd[n])return console.warn('[endless] нет звука',n);const a=new Audio(snd[n]);a.volume=.85;a.play().catch(e=>console.warn('[endless]',n,e))}

/* ---------- короткий тап (хай-хет) на символ ---------- */
let ac,noiseBuf;
function tick(){
  try{ac=ac||new (window.AudioContext||webkitAudioContext)();if(ac.state==='suspended')return;
    if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*.03,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    const t=ac.currentTime,src=ac.createBufferSource(),hp=ac.createBiquadFilter(),g=ac.createGain();
    src.buffer=noiseBuf;src.playbackRate.value=.9+Math.random()*.3;hp.type='highpass';hp.frequency.value=7000;
    g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.0001,t+.018);
    src.connect(hp).connect(g).connect(ac.destination);src.start(t);src.stop(t+.025);
  }catch{}
}
addEventListener('pointerdown',()=>{try{ac=ac||new (window.AudioContext||webkitAudioContext)();ac.resume()}catch{}},{once:true});

/* ---------- печать ---------- */
let typeTimer;
let typedText='';
function typeOut(text,bad,big){
  if(big&&text===typedText)return;   // во время долбёжки не перезапускаем ту же фразу — пусть допечатается
  typedText=text;
  clearInterval(typeTimer);typed.textContent='';typed.className=(bad?'bad':'')+(big?' big':'');
  let i=0;typeTimer=setInterval(()=>{const c=text[i];typed.textContent=text.slice(0,++i);if(c&&c.trim())tick();if(i>=text.length)clearInterval(typeTimer)},big?22:bad?38:28);
}

/* ---------- волны по форме шестиугольника ---------- */
const cv=$('#waves'),cx=cv.getContext('2d');let W,H;const fit=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};fit();
let lastKind='good',pressT=-1e9,mood='idle',lastT=0,spawnAcc=0,heat=0;const rings=[];
/* «накал» 0..1: пока кнопка трясётся — плавно растёт, потом долго экспоненциально остывает */
const HEAT={good:{shake:800,tail:7},fake:{shake:800,tail:7},bad:{shake:350,tail:5}};
const IDLE_MS=3200,FAST_MS=110;
const colors={good:'93,255,154',fake:'159,240,106',bad:'201,166,255',idle:'120,70,200'};
const HEXPTS=(()=>{const p=[],n=40;for(let i=0;i<6;i++){const[a,b]=[HEX[i],HEX[(i+1)%6]];
  for(let j=0;j<n;j++){const u=j/n,x=a[0]+(b[0]-a[0])*u,y=a[1]+(b[1]-a[1])*u;p.push([x,y,Math.atan2(y,x)])}}return p})();
function frame(t){
  cx.clearRect(0,0,W,H);
  const since=(t-pressT)/1000,energy=Math.exp(-since/6);
  const dt=Math.min(100,t-(lastT||t));lastT=t;
  const h=HEAT[lastKind]||HEAT.good,sinceMs=t-pressT;
  if(sinceMs<h.shake){const u=sinceMs/h.shake;heat=Math.max(heat,u*u*(3-2*u))}  // плавный разгон
  else heat*=Math.exp(-dt/1000/h.tail*2.3);                                     // длинный хвост
  const every=IDLE_MS*Math.pow(FAST_MS/IDLE_MS,heat);                            // логарифмическая интерполяция частоты
  spawnAcc+=dt/every;
  while(spawnAcc>=1){spawnAcc-=1;rings.push({born:t,mood:heat>.08?(lastKind||mood):'idle',lobes:3+(Math.random()*4|0),seed:Math.random()*6})}
  if(rings.length>160)rings.splice(0,rings.length-160);
  const cr=cube.getBoundingClientRect(),x=cr.left+cr.width/2,y=cr.top+cr.height/2,unit=cr.height/280;
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i],age=(t-r.born)/1000,sc=1.02+age*(r.mood==='bad'?.14+.3*energy:.22+.5*energy);
    const alpha=Math.max(0,1-age/(r.mood==='bad'?11:6))*(r.mood==='idle'?.2:.75);
    if(alpha<=0){rings.splice(i,1);continue}
    const dist=sc-1,amp=dist*(r.mood==='bad'?26:14)*(.4+energy),k=r.lobes+Math.floor(dist*3),ph=t/900+r.seed;
    cx.beginPath();
    for(const[px,py,th] of HEXPTS){let m=Math.sin(th*k+ph+age*2);if(r.mood==='bad')m*=Math.sin(th*17+ph*3);
      const s2=sc+amp*m/128;cx.lineTo(x+px*s2*unit,y+py*s2*unit)}
    cx.closePath();cx.strokeStyle=`rgba(${colors[r.mood]},${alpha})`;cx.lineWidth=r.mood==='bad'?1:2;cx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- слежка за тем, что делает игрок ---------- */
const nav=performance.getEntriesByType('navigation')[0]?.type||'navigate';
const W0={ss:SS.get('emc_pressed'),t0:performance.now()};   // было ли нажатие в этой вкладке до перезагрузки
const ev={resized:false,leftTab:false,otherTab:false,pressesSinceLoad:0,recent:[],enterSide:null,lastShown:''};
/* долбёжка: стадия 0 — нет, 1 — сказали «не помогает», 2+ — видим, что ускорился */
const spam={stage:0,baseRate:0,bigStart:0,bigPresses:0,last:0};
const SPAM_BIG=[
  'Я ВИЖУ. ТЫ СТАЛ ДОЛБИТЬ БЫСТРЕЕ.',
  'ЕЩЁ БЫСТРЕЕ? СЕРЬЁЗНО?',
  'ТЫ ДУМАЕШЬ, У МЕНЯ КОНЧИТСЯ ТЕРПЕНИЕ РАНЬШЕ, ЧЕМ У ТЕБЯ ПАЛЕЦ?',
  'Я СЧИТАЮ КАЖДОЕ НАЖАТИЕ.',
  'ЛАДНО. ЛАДНО. ПОДОЖДИ…',
];
function rate(now){return ev.recent.filter(x=>now-x<2000).length/2}   // нажатий в секунду за последние 2 с
function spamStep(now){
  if(now-spam.last>3000)Object.assign(spam,{stage:0,bigPresses:0});    // перестал — всё забыли
  spam.last=now;const r=rate(now);
  if(spam.stage===0){if(ev.recent.length>=5){spam.stage=1;spam.baseRate=r;return {text:'Долбить быстрее тоже не помогает.'}}return null}
  if(spam.stage===1){
    if(r>=3&&r>spam.baseRate*1.25){spam.stage=2;spam.bigStart=now;spam.bigPresses=0}
    else return {text:'Долбить быстрее тоже не помогает.'};
  }
  spam.bigPresses++;
  if(r<2.5)return {text:SPAM_BIG[Math.min(spam.stage-2,SPAM_BIG.length-1)],big:true}; // сбавил темп — держим текущую фразу
  if(spam.bigPresses>=45&&now-spam.bigStart>12000){Object.assign(spam,{stage:0,bigPresses:0});return {fake:true}}
  spam.stage=2+Math.min(SPAM_BIG.length-1,Math.floor(spam.bigPresses/9));
  return {text:SPAM_BIG[spam.stage-2],big:true};
}
let resizeT;addEventListener('resize',()=>{fit();clearTimeout(resizeT);resizeT=setTimeout(()=>ev.resized=true,400)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)ev.leftTab=true});
cube.addEventListener('pointerenter',e=>{const r=cube.getBoundingClientRect();ev.enterSide=e.clientX<r.left+r.width/2?'слева':'справа'});
let bc;try{bc=new BroadcastChannel('emc');bc.onmessage=e=>{if(e.data==='hi'){ev.otherTab=true;bc.postMessage('here')}if(e.data==='here')ev.otherTab=true};bc.postMessage('hi')}catch{}

/* правдивые «причины сброса» — каждая про то, что реально случилось */
function reason(s,now){
  const out=[];
  if(!s.uaSame)out.push('ты пришёл из другого браузера, а IP-то прежний.');
  const sec=new Date(now).getSeconds();out.push(`ты нажал на ${sec}-й секунде, а она ${sec%2?'нечётная':'чётная'}.`);
  if(ev.enterSide)out.push(`курсор зашёл на кнопку ${ev.enterSide}. А надо было с другой стороны.`);
  out.push(`ты смотрел на волны ${Math.round((now-W0.t0)/1000)} с. Слишком долго.`);
  if(s.me)out.push(`твой хеш начинается на «${s.me[0]}». Не та буква.`);
  return 'Причина сброса: '+out[Math.random()*out.length|0];
}

async function press(){
  const now0=performance.now();
  if(now0<lockUntil||!$('#choice').hidden)return;          // чекпоинт ещё читается / ждём выбора
  if(game.mode==='game')return gamePress(now0);
  const now=now0;ev.pressesSinceLoad++;ev.recent=ev.recent.filter(x=>now-x<10000);ev.recent.push(now);
  const ls=LS.get('emc_sig'),ck=CK.get('_ga_mc'),db=await IDB_get('sig');
  const any=ls||ck||db,sig=db||ls||ck;
  const s=await server('check');let kind='bad',text,big=false;
  const sp=s.known&&!s.fake&&any?spamStep(now):null;armWait(sp);

  if(!s.known){
    await server('register');s.list=[s.me,...(s.list||[])];
    await writeMarks(Math.random().toString(36).slice(2,10));
    kind='good';text='Ты зарегистрирован. Добро пожаловать в бесконечность.';
  }else if(s.fake){                       // в прошлый раз показали ненастоящий зелёный
    await server('unfake');if(!any)await writeMarks(Math.random().toString(36).slice(2,10));
    found('reveal');if(!s.uaSame)found('browser');
    text='Ага, в прошлый раз было зелёным, и ты подумал, что снова зарегистрировался. Но это был не тот зелёный. Я тебя не пропускаю, я тебя просто наебал! '+reason(s,Date.now());
  }else if(!any){                         // стёр всё, но IP тот же
    found('wipe');SS.set('emc_pressed','1');return fakeReg();
  }else if(ck&&(ls||db)&&ck!==(db||ls)){
    await writeMarks(db||ls);
    found('trap');text='Ууу, я смотрю, ты нашёл мою ловушку в кукис! Правильное ли это было значение? Нет.';
  }else if(!ls&&ck&&db){
    await writeMarks(sig);found('ls');text='Ага, ты почистил localStorage. А кука осталась — я всё видел.';
  }else if(!ck&&(ls||db)){
    await writeMarks(sig);found('cookie');text='Куку удалил? Хитро. Но я записал тебя ещё в паре мест.';
  }else if(!db&&ls&&ck){
    await writeMarks(sig);found('idb');text='IndexedDB подчистил? Мило. Кука и localStorage передают привет.';
  }else if(sp&&sp.fake){                 // додолбился — получи «регистрацию»
    found('spamfake');SS.set('emc_pressed','1');return fakeReg();
  }else if(sp&&sp.big){
    found('spamfast');text=sp.text;big=true;
  }else if(ev.otherTab){
    ev.otherTab=false;found('othertab');text='Вторая вкладка со мной не поможет. Я вижу обе.';
  }else if(ev.pressesSinceLoad===1&&nav==='reload'&&W0.ss){
    found('reload');text='Я видел, что ты обновил страницу. Нет, это не работает.';
  }else if(ev.pressesSinceLoad===1&&nav==='back_forward'){
    found('back');text='Кнопка «назад» тоже ничего не стирает.';
  }else if(ev.resized){
    ev.resized=false;found('resize');text='Поменял размер окна? Твой IP от этого не изменился.';
  }else if(ev.leftTab){
    ev.leftTab=false;found('lefttab');text='Сходил в другую вкладку и вернулся. Я никуда не делся.';
  }else if(sp){
    found('spam');text=sp.text;
  }else{
    found('already');text='Ты уже зарегистрировался, кнопка теперь нажимается хуже.';
  }
  SS.set('emc_pressed','1');show(kind,text,s,big);
}

let offTimer;
const glowColor={good:'#5dff9a',fake:'#9ff06a',bad:'#c9a6ff'};
/* ================= ИГРА В ФЕЙКОВЫЕ ЗЕЛЁНЫЕ ================= */
const game={mode:null,n:0,f:0,c2:false};
let lockUntil=0;
function lock(ms){lockUntil=performance.now()+ms;cube.classList.add('locked');setTimeout(()=>{if(performance.now()>=lockUntil)cube.classList.remove('locked')},ms+20)}
function sync(st){if(!st)return;Object.assign(game,{mode:st.mode,n:st.n|0,f:st.f|0,c2:!!st.c2});drawCounters()}

/* сегментные часы */
const SEGMAP=['1111110','0110000','1101101','1111001','0110011','1011011','1011111','1110000','1111111','1111011'];
function seg(el,num,digits){
  const str=String(Math.max(0,num|0)).padStart(digits,' ').slice(-Math.max(digits,String(num).length));
  if(el.children.length!==str.length){el.innerHTML='';for(const _ of str){const d=document.createElement('div');d.className='dg';d.innerHTML='<i></i>'.repeat(7);el.append(d)}}
  [...str].forEach((ch,i)=>{const m=ch===' '?'0000000':SEGMAP[+ch];[...el.children[i].children].forEach((s,j)=>s.classList.toggle('on',m[j]==='1'))});
}
function drawCounters(){
  $('#ctrNBox').hidden=game.mode!=='game';$('#ctrFBox').hidden=!(game.mode==='game'&&game.c2);
  if(game.mode==='game')seg($('#ctrN'),game.n,7);
  if(game.c2)seg($('#ctrF'),game.f,4);
}

/* выбор: [{label, fn}] */
function choose(opts){
  const box=$('#choice');box.innerHTML='';
  for(const o of opts){const b=document.createElement('button');b.textContent=o.label;
    b.onclick=async()=>{box.hidden=true;await o.fn()};box.append(b)}
  box.hidden=false;
}

/* чекпоинты игры: на каждом — фейковый зелёный и новая фраза */
const CHECKPOINTS=[
  [25,'ДВАДЦАТЬ ПЯТЬ. ЭТО РАЗМИНКА.'],
  [100,'СТО. Я УЖЕ НЕ УДИВЛЯЮСЬ.'],
  [250,'ТЫ ВСЁ ЕЩЁ ЗДЕСЬ.'],
  [500,'ПОЛТЫСЯЧИ. ПАЛЕЦ ЖИВ?'],
  [1000,'ТЫСЯЧА. ЛАДНО, ОБЕЩАЮ: НА 1 000 000-М НАЖАТИИ БУДЕТ НАСТОЯЩИЙ НОВЫЙ ЗЕЛЁНЫЙ.'],
  [2500,'ДО МИЛЛИОНА ОСТАЛОСЬ 997 500. Я ПОСЧИТАЛ.'],
  [5000,'ПЯТЬ ТЫСЯЧ. ТЫ ВООБЩЕ СПИШЬ?'],
  [10000,'ДЕСЯТЬ ТЫСЯЧ. ЗАПИШИ ЭТО В РЕЗЮМЕ.'],
  [25000,'КНОПКА ПРОСИТ ПЕРЕДАТЬ, ЧТО ЕЙ БОЛЬНО.'],
  [50000,'ПЯТЬДЕСЯТ ТЫСЯЧ. Я НАЧИНАЮ ТЕБЯ УВАЖАТЬ.'],
  [100000,'СТО ТЫСЯЧ. ОБЕЩАНИЕ В СИЛЕ.'],
  [250000,'ЧЕТВЕРТЬ МИЛЛИОНА. НЕ СДАВАЙСЯ.'],
  [500000,'ПОЛОВИНА. Я ЖЕ ГОВОРИЛ — БУДЕТ НАСТОЯЩИЙ.'],
  [1000000,'МИЛЛИОН. ВОТ ОН — НАСТОЯЩИЙ НОВЫЙ ЗЕЛЁНЫЙ.'],
];
function checkpointAt(prev,n){
  for(const [cp,txt] of CHECKPOINTS)if(prev<cp&&n>=cp)return txt;
  const M=1e6;if(n>M&&Math.floor(prev/M)<Math.floor(n/M))return `${Math.floor(n/M)} МИЛЛИОНА. ЗЕЛЁНЫЙ ВСЁ ЕЩЁ НЕ ТОТ.`;
  return null;
}
let after1M=false;
function maybeOfferC2(){
  if(game.c2||LS.get('emc_c2_no')===String(game.f))return;
  if(!(game.n>=1e6||game.f>=5))return;
  setTimeout(()=>{
    typeOut(game.n>=1e6?'Ладно, ты заслужил честность: счётчик фейковых зелёных. Показать?':'Ты собрал уже '+game.f+' фейковых зелёных. Хочешь, буду их считать отдельно?',true);
    choose([{label:'Показать счётчик',fn:async()=>{sync(await server('c2',true));found('c2');typeOut('Теперь игра честная: собирай фейковые зелёные.',true,true)}},
            {label:'Не надо',fn:async()=>{LS.set('emc_c2_no',String(game.f));typeOut('Как хочешь.',true)}}]);
  },lockUntil-performance.now()+50);
}

async function gamePress(now){
  ev.recent=ev.recent.filter(x=>now-x<10000);ev.recent.push(now);
  const prev=game.n,st=await server('tap');sync(st);
  if(after1M){after1M=false;show('bad','…ну ты понял. Он тоже был не тот.',st,true);maybeOfferC2();return}
  const cp=checkpointAt(prev,game.n),sp=spamStep(now);armWait(sp);
  if(cp||(sp&&sp.fake)){
    sync(await server('gamefake'));
    show('fake',cp||'ДОДОЛБИЛСЯ. ДЕРЖИ ЗЕЛЁНЫЙ. ОН НЕ НАСТОЯЩИЙ, НО ТЫ ЖЕ ЭТО УЖЕ ЗНАЕШЬ.',st,true);lock(5000);
    if(game.n>=1e6&&prev<1e6){after1M=true;found('million')}
    if(sp&&sp.fake)found('spamfake');
    maybeOfferC2();return;
  }
  if(sp)found(sp.big?'spamfast':'spam');
  show('bad',sp&&sp.big?sp.text:null,st,!!(sp&&sp.big));
}

/* ================= СЕКРЕТЫ И ДНЕВНИК ================= */
const SECRETS=[
  ['already','Нажать ещё раз','Кнопка запомнила тебя и стала нажиматься хуже.'],
  ['reload','Обновить страницу','F5 ничего не стирает.'],
  ['back','Вернуться назад','Кнопка «назад» — тоже.'],
  ['resize','Потянуть окно','Размер окна — не IP.'],
  ['lefttab','Уйти и вернуться','Пока тебя не было, я ждал.'],
  ['othertab','Вторая вкладка','Я вижу все свои вкладки.'],
  ['ls','Почистить localStorage','Кука осталась.'],
  ['cookie','Удалить куку','Я записал тебя ещё в паре мест.'],
  ['idb','Подчистить IndexedDB','Самое глубокое хранилище — и то не помогло.'],
  ['trap','Ловушка в кукис','Значение было неправильным.'],
  ['wipe','Стереть всё','Зелёный, но не тот.'],
  ['reveal','Узнать правду','«Я тебя просто наебал».'],
  ['browser','Сменить браузер','IP-то прежний.'],
  ['spam','Начать долбить','Не помогает.'],
  ['spamfast','Долбить быстрее','Я это вижу. Крупно.'],
  ['spamfake','Додолбиться','Иногда упорство вознаграждается. Фальшиво.'],
  ['wait','Подождать','Иногда надо просто остановиться.'],
  ['game','Войти в игру','Второй ненастоящий зелёный.'],
  ['million','Миллион','Настоящий новый зелёный. Почти.'],
  ['c2','Честный счётчик','Теперь фейки считаются.'],
];
const DIARY_AT=3;            // после скольких секретов рассказываем про дневник
const secrets=new Set();
function drawDiary(){
  $('#diaryBtn').hidden=secrets.size<DIARY_AT;
  $('#diaryBtn').textContent=`ДНЕВНИК ${secrets.size}/${SECRETS.length}`;
  $('#diarySub').textContent=`Открыто ${secrets.size} из ${SECRETS.length}. Тёмное — ещё не найдено.`;
  const ol=$('#diaryList');ol.innerHTML='';
  for(const [id,t,d] of SECRETS){const li=document.createElement('li');const on=secrets.has(id);li.className=on?'':'dark';
    li.innerHTML=`<b>${on?t:'█'.repeat(t.length)}</b><span>${on?d:'█'.repeat(Math.min(d.length,28))}</span>`;ol.append(li)}
}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}
function found(id){
  if(secrets.has(id))return;const meta=SECRETS.find(x=>x[0]===id);if(!meta)return;
  secrets.add(id);server('secret',id);
  if(secrets.size>DIARY_AT)toast('+ СЕКРЕТ: '+meta[1].toUpperCase());
  if(game.mode==='game'&&id!=='game')server('gamefake').then(sync);   // в игре каждый новый секрет — ещё один фейковый зелёный
  drawDiary();
  if(secrets.size===DIARY_AT)setTimeout(()=>{typeOut('Кстати. Я веду дневник твоих секретов. Тёмные строчки ты ещё не нашёл.',true);
    $('#diaryBtn').hidden=false},Math.max(0,lockUntil-performance.now())+2200);
}
$('#diaryBtn').onclick=()=>{drawDiary();$('#diary').hidden=false};
$('#diary').onclick=e=>{if(e.target.id==='diary'||e.target.classList.contains('close'))$('#diary').hidden=true};

/* секрет «подождать»: на фразе «ЛАДНО. ЛАДНО. ПОДОЖДИ…» — перестать жать и реально подождать */
const WAIT_MS=7000;let waitT;
function armWait(sp){
  clearTimeout(waitT);
  if(!(sp&&sp.big&&sp.text===SPAM_BIG[SPAM_BIG.length-1]))return;
  waitT=setTimeout(async()=>{
    if(performance.now()<lockUntil||!$('#choice').hidden)return;
    Object.assign(spam,{stage:0,bigPresses:0});ev.recent=[];found('wait');
    const t='ТЫ ПОДОЖДАЛ. ЭТО БЫЛО ТРУДНЕЕ, ЧЕМ ДОЛБИТЬ, ДА? ДЕРЖИ ЗЕЛЁНЫЙ.';
    if(game.mode==='game'){sync(await server('gamefake'));show('fake',t,null,true);lock(5000);maybeOfferC2()}
    else{SS.set('emc_pressed','1');await fakeReg(t)}
  },WAIT_MS);
}

/* фейковая рега вне игры: первая — обычный обман, со второй — вход в игру */
async function fakeReg(text){
  const st=await server('fake');sync(st);
  if(st.f<2){show('fake',text||'Ты зарегистрирован. Добро пожаловать в бесконечность.',st,!!text);lock(4500);return}
  show('fake','ТЫ ЗАРАБОТАЛ ВТОРОЙ НЕНАСТОЯЩИЙ ЗЕЛЁНЫЙ. ДОБРО ПОЖАЛОВАТЬ В ИГРУ.',st,true);lock(3500);
  setTimeout(()=>choose([
    {label:'Начать сначала',fn:async()=>{sync(await server('mode',null));typeOut('Как скажешь. Всё сначала.')}},
    {label:'Продолжить игру',fn:async()=>{sync(await server('mode','game'));found('game');typeOut('ИГРА НАЧАЛАСЬ. КАЖДОЕ НАЖАТИЕ НА СЧЕТУ.',true,true)}},
  ]),3500);
}

function show(kind,text,s,big){
  mood=kind;lastKind=kind;pressT=performance.now();play(kind);
  root.style.setProperty('--glow',glowColor[kind]);
  cube.classList.remove('shake','on','bad');void cube.offsetWidth;cube.classList.add('shake','on');cube.classList.toggle('bad',kind==='bad');
  clearTimeout(offTimer);offTimer=setTimeout(()=>{cube.classList.remove('on');mood='idle'},kind==='bad'?700:4500);
  if(text!=null)typeOut(text,kind==='bad',big);if(s)render(s);
}
function render(s){if(s.admin)$('#reset').hidden=false;ul.innerHTML='';(s.list||[]).slice(0,200).forEach(h=>{const li=document.createElement('li');li.textContent=h.slice(0,40);if(h===s.me)li.className='me';ul.append(li)})}

/* ---------- e-mail ---------- */
const em=$('#email');let sentEmail='';
async function sendEmail(){
  const v=em.value.trim();if(!v||v===sentEmail)return;
  if(!em.checkValidity()){em.className='err';return}
  try{const r=await fetch('/api/endless/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v})});
    em.className=r.ok?'ok':'err';if(r.ok)sentEmail=v}catch{em.className='err'}
}
em.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendEmail();em.blur()}});
em.addEventListener('blur',sendEmail);
em.addEventListener('input',()=>em.className='');

$('#reset').addEventListener('click',async()=>{
  await fetch('/api/endless/reset',{method:'POST'}).catch(()=>{});
  try{localStorage.clear();sessionStorage.clear()}catch{}
  document.cookie='_ga_mc=;max-age=0;path=/';try{indexedDB.deleteDatabase('emc')}catch{}
  location.reload();
});
cube.addEventListener('click',press);
server('check').then(st=>{render(st);sync(st);(st.sec||[]).forEach(x=>secrets.add(x));drawDiary();if(game.mode==='game')setTimeout(()=>typeOut('С ВОЗВРАЩЕНИЕМ В ИГРУ.',true,true),400)});
typeOut('Нажми на куб.');
</script>
