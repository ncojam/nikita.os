<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENDLESS MC SERVER</title>
<style>
:root{--top:#45237a;--mid:#1d0f33;--bot:#000;--rim:#5b2a9a;--teal:#2fd6d0;--txt:#a07ae0;--dim:#4f6b5d;
      --good:#5dff9a;--fake:#9ff06a;--bad:#c9a6ff;--glow:var(--rim)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--top) 0%,var(--mid) 55%,var(--bot) 100%)}
canvas#waves{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1fr 280px}
#stage{position:relative;display:flex;align-items:center;justify-content:center}
#typed{position:absolute;left:4%;top:20%;max-width:280px;font-size:18px;line-height:1.35;transform:rotate(-2deg);
  white-space:pre-wrap;min-height:4em;text-shadow:0 0 8px #0006}
#typed.bad{color:#d9c2ff}
#typed.big{font-size:44px;line-height:1.05;font-weight:900;max-width:min(560px,46vw);letter-spacing:-.01em;text-transform:uppercase;
  color:#e7d6ff;text-shadow:0 0 14px #c9a6ff88,0 4px 0 #0008;transform:rotate(-3deg)}
@media (max-width:760px){#typed.big{font-size:28px;max-width:90vw}}
#typed::after{content:"▌";animation:blink 1s steps(1) infinite;opacity:.7}
@keyframes blink{50%{opacity:0}}

#cubeHolder{position:relative;display:flex;flex-direction:column;align-items:center}
#cubeWrap{animation:levitate 12s ease-in-out infinite;position:relative;z-index:1}
@keyframes levitate{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(.5deg)}}
#floorShadow{width:300px;height:46px;margin-top:-8px;border-radius:50%;
  background:radial-gradient(ellipse at center,#000c 0%,#0007 40%,transparent 72%);filter:blur(6px);
  animation:shadow 12s ease-in-out infinite}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(.8);opacity:.6}}

#cube{position:relative;width:340px;height:396px;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#cube svg{width:100%;height:100%;overflow:visible;display:block}
/* подложка: отпускание медленное, удар — быстрый с перелётом */
#plate{transform-box:fill-box;transform-origin:center;
  transition:transform 1.1s cubic-bezier(.3,0,.2,1),filter 1s,fill .8s}
#plateRim{transition:stroke .8s}
#cube:hover #plate{transform:scale(1.04)}
#cube.on #plate{transform:scale(1.3);transition:transform .32s cubic-bezier(.2,2.4,.35,1),filter .2s,fill .2s;
  filter:drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 34px var(--glow)) drop-shadow(0 0 70px var(--glow))}
#cube.on #plateRim{stroke:var(--glow);transition:stroke .2s}
#cube.on #plateFill{fill:color-mix(in srgb,var(--glow) 30%,#1a0c30)}
/* камень светится еле-еле */
#stone{transition:filter 1s}
#cube.on #stone{filter:drop-shadow(0 0 5px color-mix(in srgb,var(--glow) 60%,transparent))}
#inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#inner img{position:absolute;width:56%;image-rendering:pixelated;opacity:.85}
.tag{position:relative;transform:rotate(-6deg);color:var(--teal);font-size:16px;line-height:1.35;text-align:left;
  letter-spacing:.04em;text-shadow:0 0 6px #2fd6d055}
.shake{animation:shake .8s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px) rotate(-2deg)}40%,60%{transform:translate(7px,-3px) rotate(2deg)}}

#list{border-left:2px solid var(--teal);padding:100px 14px 20px;overflow-y:auto;font-family:"Courier New",monospace;font-size:10px;color:var(--dim)}
#list h3{margin:0 0 14px;font-size:10px;letter-spacing:.3em;font-weight:normal;color:#8aa}
#list ul{margin:0;padding:0}
#list li{list-style:none;padding:2px 0;word-break:break-all}
#list li.me{color:var(--good)}
#emailBox{position:fixed;bottom:18px;left:calc((100% - 280px)/2);transform:translateX(-50%);z-index:2}
#email{width:240px;background:transparent;border:1px solid #ffffff12;color:#aaa;padding:8px 10px;font:inherit;font-size:12px;outline:none;transition:border-color .6s}
#email:focus{border-color:#ffffff26}
#email::placeholder{color:#ffffff22}
#email.ok{border-color:#5dff9a33}
#email.err{border-color:#ff8a8a33}
#cube.locked{cursor:wait}
#choice{position:absolute;left:4%;top:calc(20% + 220px);display:flex;gap:12px;z-index:3}
#choice[hidden]{display:none}
#choice button{background:#0005;color:#e7d6ff;border:1px solid #c9a6ff66;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;
  letter-spacing:.06em;transition:background .2s,border-color .2s}
#choice button:hover{background:#c9a6ff22;border-color:#c9a6ff}
#counters{position:absolute;left:4%;bottom:70px;display:flex;flex-direction:column;gap:14px;z-index:2}
.ctr[hidden]{display:none}
.ctr .lbl{font:10px "Courier New",monospace;letter-spacing:.3em;color:#8a7aa8;margin-bottom:5px}
.seg{display:flex;gap:6px;padding:8px 10px;background:#05020a;border:1px solid #2a1846;border-radius:4px;box-shadow:inset 0 0 12px #000}
.dg{position:relative;width:18px;height:32px}
.dg i{position:absolute;background:var(--c);opacity:.07;border-radius:2px;transition:opacity .08s}
.dg i.on{opacity:1;box-shadow:0 0 6px var(--c)}
.dg i:nth-child(1){left:3px;top:0;width:12px;height:3px}.dg i:nth-child(2){right:0;top:3px;width:3px;height:12px}
.dg i:nth-child(3){right:0;top:17px;width:3px;height:12px}.dg i:nth-child(4){left:3px;bottom:0;width:12px;height:3px}
.dg i:nth-child(5){left:0;top:17px;width:3px;height:12px}.dg i:nth-child(6){left:0;top:3px;width:3px;height:12px}
.dg i:nth-child(7){left:3px;top:14.5px;width:12px;height:3px}
#ctrN{--c:#ff6a3c}#ctrF{--c:#9ff06a}
@media (max-width:760px){#choice{top:auto;bottom:40%}#counters{bottom:56px}.dg{width:12px;height:22px}}
#diaryBtn{position:absolute;right:16px;top:16px;z-index:3;background:#0004;color:#c9a6ff;border:1px solid #c9a6ff44;
  font:600 11px "Courier New",monospace;letter-spacing:.2em;padding:7px 12px;cursor:pointer;transition:background .2s,transform .2s}
#diaryBtn:hover{background:#c9a6ff1a;transform:translateY(-1px)}
#diaryBtn[hidden]{display:none}
/* появление кнопки: прыжок с перелётом, вспышка и расходящееся кольцо */
#diaryBtn.appear{animation:btnPop .9s cubic-bezier(.2,1.8,.35,1) both,btnGlow 2.2s ease-out .2s}
#diaryBtn.appear::after{content:"";position:absolute;inset:-2px;border:2px solid #c9a6ff;border-radius:2px;animation:btnRing 1.1s ease-out .15s both;pointer-events:none}
@keyframes btnPop{0%{transform:scale(0) rotate(-14deg);opacity:0}55%{transform:scale(1.28) rotate(4deg);opacity:1}78%{transform:scale(.93) rotate(-1deg)}100%{transform:scale(1) rotate(0)}}
@keyframes btnGlow{0%{box-shadow:0 0 0 #c9a6ff00}20%{box-shadow:0 0 26px #c9a6ffaa,0 0 60px #c9a6ff55}100%{box-shadow:0 0 0 #c9a6ff00}}
@keyframes btnRing{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4,3.2);opacity:0}}
#diary{position:fixed;inset:0;z-index:10;background:#05020ccc;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  animation:fadeIn .3s ease-out both;perspective:1000px}
#diary.closing{animation:fadeOut .28s ease-in both}
@keyframes fadeIn{from{opacity:0;backdrop-filter:blur(0)}to{opacity:1}}@keyframes fadeOut{to{opacity:0}}
#diary[hidden]{display:none}
#diary .book{position:relative;width:min(560px,92vw);max-height:80vh;overflow-y:auto;background:#120824;border:1px solid #3a1c66;padding:22px 24px;
  box-shadow:0 20px 60px #000;transform-origin:50% 0;animation:bookIn .6s cubic-bezier(.2,1.35,.4,1) both,bookSway 2.4s ease-in-out .6s}
#diary.closing .book{animation:bookOut .28s cubic-bezier(.5,0,.8,.4) both}
@keyframes bookIn{0%{transform:rotateX(-70deg) translateY(-60px) scale(.7);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes bookSway{0%,100%{transform:rotate(0)}20%{transform:rotate(.9deg)}45%{transform:rotate(-.7deg)}70%{transform:rotate(.35deg)}}
@keyframes bookOut{to{transform:rotateX(55deg) translateY(30px) scale(.85);opacity:0}}
/* уголок страницы: при открытии разгибается, при закрытии загибается обратно */
#diary .corner{position:absolute;top:-1px;right:-1px;width:16px;height:16px;pointer-events:none;
  background:linear-gradient(225deg,#05020c 0 50%,#4a2a7e 50% 58%,#2a1450 70%,#1c0d34);
  box-shadow:-3px 3px 6px #0008;animation:cornerOpen .75s cubic-bezier(.25,1.6,.4,1) .2s both}
#diary.closing .corner{animation:cornerClose .22s ease-in both}
@keyframes cornerOpen{0%{width:90px;height:90px}100%{width:16px;height:16px}}
@keyframes cornerClose{from{width:16px;height:16px}to{width:90px;height:90px}}
#diary h2{margin:0 0 4px;font:900 22px inherit;font-family:inherit;color:#e7d6ff;letter-spacing:.08em}
#diary .sub{font:11px "Courier New",monospace;color:#7a6a98;margin-bottom:16px}
#diary ol{margin:0;padding:0 0 0 22px;color:#5a4a78;font-size:14px}
#diary li{padding:6px 0;border-bottom:1px solid #ffffff08}
#diary li b{color:#e7d6ff;font-weight:700}#diary li span{display:block;color:#9a88c0;font-size:12px;margin-top:2px}
#diary li.dark b,#diary li.dark span{color:transparent;background:#000;border-radius:2px;user-select:none}
#diary .close{float:right;background:none;border:0;color:#9a88c0;font-size:20px;cursor:pointer}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%) translateY(-80px);z-index:9;background:#120824;border:1px solid #9ff06a66;
  color:#d9ffc0;font:600 12px "Courier New",monospace;letter-spacing:.12em;padding:8px 14px;transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
#toast.show{transform:translateX(-50%) translateY(0)}
#bpm{position:absolute;left:50%;top:calc(50% + 230px);transform:translateX(-50%);z-index:2;font:700 12px "Courier New",monospace;
  letter-spacing:.25em;color:#c9a6ff;opacity:0;transition:opacity .4s;pointer-events:none}
#bpm.on{opacity:.85}#bpm.beat{animation:beat .18s ease-out}
@keyframes beat{0%{transform:translateX(-50%) scale(1.35);color:#fff}100%{transform:translateX(-50%) scale(1)}}
@media (max-width:760px){#bpm{top:calc(50% + 160px)}}
#diaryBtn .cnt{display:inline-block;transition:color .3s}
#diaryBtn.hit{animation:btnHit .45s cubic-bezier(.36,.07,.19,.97)}
#diaryBtn.hit .cnt{animation:cntFlash 1s ease-out}
@keyframes btnHit{15%{transform:scale(1.22) rotate(-4deg)}30%{transform:scale(.92) rotate(3deg)}45%{transform:translate(3px,-2px) rotate(-2deg)}
  60%{transform:translate(-2px,1px) rotate(1deg)}100%{transform:none}}
@keyframes cntFlash{0%{color:#fff;text-shadow:0 0 10px #fff,0 0 20px #c9a6ff;transform:scale(1.6)}100%{color:inherit;text-shadow:none;transform:scale(1)}}
.achv{position:fixed;z-index:20;left:0;top:0;pointer-events:none;background:#140a26;border:1px solid #c9a6ff88;color:#efe4ff;
  font:700 13px "Courier New",monospace;letter-spacing:.12em;padding:10px 16px;white-space:nowrap;box-shadow:0 0 24px #c9a6ff55,0 10px 30px #000a}
.achv small{display:block;font-size:9px;letter-spacing:.35em;color:#9ff06a;margin-bottom:3px}
.spark{position:fixed;z-index:21;width:4px;height:4px;border-radius:50%;pointer-events:none;background:#fff;box-shadow:0 0 6px #c9a6ff,0 0 12px #c9a6ff}
#reset{position:fixed;top:10px;left:10px;z-index:3;background:#0006;color:#f9a;border:1px dashed #f9a6;font:11px monospace;padding:4px 8px;cursor:pointer}
#cube.bad.on #plate{filter:drop-shadow(0 0 calc(8px*var(--gq,1)) var(--glow)) drop-shadow(0 0 calc(24px*var(--gq,1)) var(--glow))}
#cube.bad.perfect.on #plate{transform:scale(1.34);filter:drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 40px var(--glow)) drop-shadow(0 0 80px var(--glow))}
#cube.bad #plate{transition:transform 2.4s cubic-bezier(.2,0,.1,1),filter 2.4s,fill 2s}
#cube.bad #plateRim,#cube.bad #stone{transition:stroke 2.2s,filter 2.2s}
.shake.bad{animation-duration:.35s}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 150px}
  #list{border-left:0;border-top:2px solid var(--teal);padding-top:14px}#typed{top:6%;font-size:15px}
  #cube{width:240px;height:280px}#emailBox{left:50%}}
</style>
</head>
<body>
<canvas id="waves"></canvas>
<main>
  <section id="stage">
    <div id="typed"></div>
    <div id="choice" hidden></div>
    <div id="bpm"></div>
    <div id="counters">
      <div class="ctr" id="ctrNBox" hidden><div class="lbl">PRESSES</div><div class="seg" id="ctrN"></div></div>
      <div class="ctr" id="ctrFBox" hidden><div class="lbl">FAKE GREENS</div><div class="seg" id="ctrF"></div></div>
    </div>
    <div id="cubeHolder"><div id="cubeWrap"><button id="cube" aria-label="press">
      <svg viewBox="0 0 240 280">
        <defs>
          <linearGradient id="stoneG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160a28"/><stop offset="1" stop-color="#0a0514"/></linearGradient>
        </defs>
        <g id="plate"><path id="plateFill" fill="#1a0c30"/><path id="plateRim" fill="none" stroke="var(--rim)" stroke-width="5"/></g>
        <g id="stone"><path id="stoneFill" fill="url(#stoneG)" stroke="#3a1c66" stroke-width="2"/></g>
      </svg>
      <div id="inner">
        <img src="/endless/cube.png" alt="" onerror="this.remove()">
        <div class="tag">ENDLESS MC SERVER<br>ENDLESS DIRECTIONS<br>ENDLESS POSSIBILITIES</div>
      </div>
    </button></div><div id="floorShadow"></div></div>
  </section>
  <button id="diaryBtn" hidden>ДНЕВНИК</button>
  <aside id="list"><h3>REGISTERED</h3><ul id="ul"></ul></aside>
</main>
<button id="reset" hidden>TEST: стереть мою регистрацию</button>
<div id="diary" hidden><div class="book"><div class="corner"></div><button class="close" aria-label="close">×</button>
  <h2>ДНЕВНИК СЕКРЕТОВ</h2><div class="sub" id="diarySub"></div><ol id="diaryList"></ol></div></div>
<div id="toast"></div>
<div id="emailBox"><input id="email" type="email" placeholder="e-mail" autocomplete="email" maxlength="254"></div>

<script>
const API='/api/endless/press', SALT='endless-v1';
const $=s=>document.querySelector(s);
const cube=$('#cube'), typed=$('#typed'), ul=$('#ul'), root=document.documentElement, holder=$('#cubeHolder');

/* ---------- шестиугольник со скруглёнными углами ---------- */
const HEX=[[0,-128],[102,-74],[102,74],[0,128],[-102,74],[-102,-74]]; // относительно центра 120,140
function roundedHex(scale,r){
  const P=HEX.map(([x,y])=>[120+x*scale,140+y*scale]);let d='';
  P.forEach((p,i)=>{const a=P[(i+5)%6],b=P[(i+1)%6];
    const u=(q)=>{const dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy);return [p[0]+dx/l*r,p[1]+dy/l*r]};
    const s=u(a),e=u(b);d+=(i?'L':'M')+s[0].toFixed(1)+' '+s[1].toFixed(1)+'Q'+p[0]+' '+p[1]+' '+e[0].toFixed(1)+' '+e[1].toFixed(1)});
  return d+'Z';
}
$('#plateFill').setAttribute('d',roundedHex(1,22));$('#plateRim').setAttribute('d',roundedHex(1,22));
$('#stoneFill').setAttribute('d',roundedHex(.84,18));

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- хранилища ---------- */
const LS={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const SS={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}}};
const CK={get:k=>(document.cookie.match('(?:^|; )'+k+'=([^;]*)')||[])[1]||null,set:(k,v)=>document.cookie=`${k}=${v};max-age=31536000;path=/;SameSite=Lax`};
function idb(){return new Promise(r=>{try{const q=indexedDB.open('emc',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}})}
async function IDB_get(k){const d=await idb();if(!d)return null;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)})}
async function IDB_set(k,v){const d=await idb();if(d)d.transaction('kv','readwrite').objectStore('kv').put(v,k)}
async function writeMarks(sig){LS.set('emc_sig',sig);CK.set('_ga_mc',sig);await IDB_set('sig',sig)}

/* ---------- сервер (мок, если API нет) ---------- */
async function server(action,value){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,value})});
    if(!r.ok)throw 0;return await r.json();
  }catch{
    let ip=await IDB_get('mock_ip');if(!ip){ip=crypto.randomUUID();await IDB_set('mock_ip',ip)}
    const h=await sha(await sha(ip+SALT)+SALT),m=JSON.parse(await IDB_get('mock')||'{"list":[],"fake":false}');
    const known=m.list.includes(h);
    if(action==='register'&&!known)m.list.unshift(h);
    m.n=m.n||0;m.f=m.f||0;
    if(known&&action==='fake'){m.fake=true;m.f++}if(action==='unfake')m.fake=false;
    if(known&&action==='gamefake'&&m.mode==='game')m.f++;
    if(known&&action==='tap'&&m.mode==='game')m.n++;
    if(known&&action==='mode'){m.mode=value==='game'?'game':null;m.fake=false}
    if(known&&action==='c2')m.c2=!!value;
    m.prog=m.prog||{};if(known&&action==='prog')m.prog[value.k]=value.v;
    m.sec=m.sec||[];if(known&&action==='secret'&&!m.sec.includes(value))m.sec.push(value);
    await IDB_set('mock',JSON.stringify(m));
    return {known,fake:m.fake,uaSame:true,me:h,list:m.list,n:m.n,f:m.f,mode:m.mode||null,c2:!!m.c2,sec:m.sec,prog:m.prog};
  }
}

/* ---------- звуки ---------- */
const snd={};  // имя -> url первого существующего файла
(async()=>{for(const n of ['good','fake','bad'])for(const ext of ['ogg','mp3','wav']){
  const url=`/endless/sounds/${n}.${ext}`;
  try{const r=await fetch(url,{method:'HEAD',cache:'no-store'});if(r.ok){snd[n]=url;new Audio(url).preload='auto';break}}catch{}
}console.log('[endless] звуки:',snd)})();
/* ---------- грув ----------
   1) offer   — заметили ровную долбёжку, предлагаем замер;
   2) measure — считаем 8 ударов, берём медиану интервала → фиксированный BPM (дальше не плывёт);
   3) play    — свой часовой механизм: хай-хет на каждую восьмую (акцент на долю), снейр на 2 и 4;
                звук нажатия игрока снапается к ближайшей восьмой.
   Если игрок перестал жать — через 2 такта начинаем затухать, ещё за 4 такта музыка гаснет.        */
/* грув открывается только поздно: оба счётчика уже есть (игра + FAKE GREENS),
   дневник уже показан и секрет «Ритм» (свой ритм без музыки) уже пройден */
function grooveUnlocked(){return game.mode==='game'&&game.c2&&diaryShown&&secrets.has('rhythm')}
const GROOVE_WARMUP=16;   // столько ровных интервалов подряд нужно, прежде чем предложим грув (≈4 такта)
const groove={state:'off',on:false,P:.5,origin:0,taps:[],lastTap:0,step:0,timer:0,gain:null};
const bufs={};
async function getBuf(n){
  if(bufs[n]!==undefined)return bufs[n];bufs[n]=null;const a=AC();if(!a||!snd[n])return null;
  try{bufs[n]=await a.decodeAudioData(await (await fetch(snd[n])).arrayBuffer())}catch{bufs[n]=null}return bufs[n];
}
let noise1;
function noiseBuf1(a){if(!noise1){noise1=a.createBuffer(1,a.sampleRate*.25,a.sampleRate);const d=noise1.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return noise1}
function hat(a,t,acc,out){
  const src=a.createBufferSource(),hp=a.createBiquadFilter(),g=a.createGain();src.buffer=noiseBuf1(a);hp.type='highpass';hp.frequency.value=8000;

function grooveOnPress(intervalMs){

    groove.gain.gain.setTargetAtTime(1,a.currentTime,.05);return null}

    if(intervalMs>1500){groove.taps=[];bpmBadge('ЗАМЕР 0/8');return null}
    groove.taps.push(intervalMs);bpmBadge(`ЗАМЕР ${groove.taps.length}/8`);
    if(groove.taps.length<8)return null;
    const m=[...groove.taps].sort((x,y)=>x-y),med=(m[3]+m[4])/2;
    let P=med/1000;while(P<.3)P*=2;while(P>1)P/=2;          // держим 60–200 BPM, слишком быстро → считаем восьмыми
    startGroove(P);found('groove');

  }

}
function offerGroove(){groove.state='measure';groove.taps=[];['good','fake','bad'].forEach(getBuf);bpmBadge('ЗАМЕР 0/8');
  return {big:true,text:'ПОХОЖЕ, У ТЕБЯ ЕСТЬ РИТМ. ДАВАЙ ЗАМЕРЮ: ДОЛБИ РОВНО, Я ПОСЧИТАЮ 8 УДАРОВ.'}}
function startGroove(P){

  bpmBadge('♩ '+Math.round(60/P)+' BPM');

}
function schedule(){
  const a=AC();if(!a||!groove.on)return;const half=groove.P/2,ahead=a.currentTime+.12;
  // затухание при бездействии: 2 такта ждём, потом 4 такта гаснем
  const idle=a.currentTime-groove.lastTap,bar=groove.P*4;
  if(idle>bar*2){const v=Math.max(0,1-(idle-bar*2)/(bar*4));groove.gain.gain.setTargetAtTime(v,a.currentTime,.1);if(v<=0){stopGroove();return}}

    const t=groove.origin+groove.step*half,st=groove.step%8;
    hat(a,t,st%2===0,groove.gain);
    if(st===2||st===6)snare(a,t,groove.gain);
    const bar=Math.floor(groove.step/8),ch=PROG[bar%4];
    if(bar>=BASS_AT&&BASS_PAT[st])bass(a,t,ch[0]*BASS_PAT[st],half*.9,groove.gain);
    if(bar>=PADS_AT&&st===0)pad(a,t,ch[1],groove.P*4,groove.gain);
    if(st===0&&bar===BASS_AT)setTimeout(()=>bpmBadge('♩ '+Math.round(60/groove.P)+' BPM · BASS'),Math.max(0,(t-a.currentTime)*1000));
    if(st===0&&bar===PADS_AT)setTimeout(()=>{bpmBadge('♩ '+Math.round(60/groove.P)+' BPM · BASS · PADS');found('band')},Math.max(0,(t-a.currentTime)*1000));

function stopGroove(silent){

/* звук нажатия во время грува — на ближайшую восьмую сетки */
function grooveHit(n){
  const a=AC();if(!a||groove.state!=='play')return false;
  const now=a.currentTime,half=groove.P/2,k=(now-groove.origin)/half,fl=Math.floor(k),slot=k-fl<.3?fl:fl+1;
  const when=Math.max(now,groove.origin+slot*half),b=bufs[n];

  groove.lastQ=Math.max(0,Math.min(1,1-err/(half*.45)));         // 1 — точно в сетку, 0 — мимо на четверть восьмой и больше
  if(!b){getBuf(n);return false}

    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=Math.max(1400,9000*Math.pow(.82,bar));node.connect(lp);node=lp;   // верх уходит с каждым тактом

  node.connect(g).connect(groove.gain);src.start(when);

  const q=groove.lastQ,gb=bufs.good;

    s2.connect(lp2).connect(g2).connect(groove.gain);s2.start(when)}
  return true;
}

/* мягкий колокольчик: треугольник + синус, фильтр срезает «квадратность», плавная атака */
function chime(){
  const a=AC();if(!a)return;const t0=a.currentTime,out=a.createGain(),lp=a.createBiquadFilter();
  lp.type='lowpass';lp.frequency.value=2600;out.gain.value=.9;lp.connect(out).connect(a.destination);
  [[659.3,0],[987.8,.09],[1318.5,.18],[1975.5,.3]].forEach(([f,dt],i)=>{
    for(const [type,det,vol] of [['triangle',0,.05],['sine',6,.03]]){
      const o=a.createOscillator(),g=a.createGain(),t=t0+dt;o.type=type;o.frequency.value=f;o.detune.value=det;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol*(i===3?.7:1),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.7+i*.12);
      o.connect(g).connect(lp);o.start(t);o.stop(t+1.2);
    }
  });
}
/* шелест страницы: шум в полосе 1.5–5 кГц с «дрожащей» громкостью */
function rustle(close){
  const a=AC();if(!a)return;const t0=a.currentTime,len=close?.16:.24;
  const buf=a.createBuffer(1,a.sampleRate*len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();
  src.buffer=buf;bp.type='bandpass';bp.Q.value=.8;
  bp.frequency.setValueAtTime(close?4200:1800,t0);bp.frequency.linearRampToValueAtTime(close?1800:4500,t0+len);
  g.gain.setValueAtTime(0,t0);
  for(let k=0;k<7;k++){const t=t0+k*len/7;g.gain.linearRampToValueAtTime((.05+.05*Math.random())*(1-k/9),t+len/14);g.gain.linearRampToValueAtTime(.012,t+len/7)}

  src.connect(bp).connect(g).connect(a.destination);src.start(t0);src.stop(t0+len+.02);
}
function tick(){

    if(!noiseBuf){noiseBuf=ac.createBuffer(1,ac.sampleRate*.03,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}

const HEAT={good:{shake:800,tail:7},fake:{shake:800,tail:7},bad:{shake:350,tail:5}};
const IDLE_MS=3200,FAST_MS=110;

const HEXPTS=(()=>{const p=[],n=40;for(let i=0;i<6;i++){const[a,b]=[HEX[i],HEX[(i+1)%6]];
  for(let j=0;j<n;j++){const u=j/n,x=a[0]+(b[0]-a[0])*u,y=a[1]+(b[1]-a[1])*u;p.push([x,y,Math.atan2(y,x)])}}return p})();
function frame(t){

  const dt=Math.min(100,t-(lastT||t));lastT=t;
  const h=HEAT[lastKind]||HEAT.good,sinceMs=t-pressT;
  if(sinceMs<h.shake){const u=sinceMs/h.shake;heat=Math.max(heat,u*u*(3-2*u))}  // плавный разгон
  else heat*=Math.exp(-dt/1000/h.tail*2.3);                                     // длинный хвост

  spawnAcc+=dt/every;

  for(let i=rings.length-1;i>=0;i--){

                 'А ЕСЛИ ДОЛБИТЬ РОВНО, КАК МЕТРОНОМ…','НЕТ, СЛИШКОМ ХАОТИЧНО.','ТИШЕ… ТИШЕ…'],fake:'ФИНАЛЬНЫЙ АККОРД. ЗЕЛЁНЫЙ.'}}},
];
function deepLines(L){ // слой 4 и дальше — бесконечный, с подсказками вперемешку
  const pool=['СЛОЙ {L}. СЛЕДУЮЩИЙ ТОЛЩЕ.','ДО ЗЕЛЁНОГО ТЕПЕРЬ {need} НАЖАТИЙ. Я ДОБАВИЛ.','ПОДБИРАЮ: {code}','ТЫ СИЛЬНЕЕ, ЧЕМ Я ДУМАЛ.',
    'ТЁМНЫЕ СТРОЧКИ В ДНЕВНИКЕ — НЕ ДЕКОРАЦИЯ.','НЕКОТОРЫЕ СЕКРЕТЫ ПРЯЧУТСЯ В ПАУЗАХ.','ТЫ ПРОБОВАЛ ДОЛБИТЬ РОВНО?','НОЧЬЮ ЗДЕСЬ ВСЁ ИНАЧЕ.',
    'ИНТЕРЕСНО, ЧТО БУДЕТ, ЕСЛИ ОТКРЫТЬ МЕНЯ В ДРУГОМ БРАУЗЕРЕ.','КНОПКА ПОМНИТ ТЕБЯ ДОЛЬШЕ, ЧЕМ КУКИ.','СЛОЙ {L}. Я НАЧИНАЮ ЗАПОМИНАТЬ ТВОЙ РИТМ.'];
  const n=5+Math.min(L,10),out=[];for(let i=0;i<n;i++)out.push(pool[(i*5+L*3)%pool.length]);
  out.push('ЛАДНО. ПЕРЕДЫШКА…');return {lines:out,fake:'СЛОЙ {L} ПРОБИТ. ДЕРЖИ ЗЕЛЁНЫЙ.'};
}
function layer(){
  const L=prog.bf;if(L>=ARC.length)return deepLines(L);
  const a=ARC[L];if(!a.fork)return a;
  return prog.why?a.by[prog.why]:null;  // null — сначала развилка
}
const needFor=L=>45+L*25;                 // брут-форс «дальше»: каждый слой требует больше нажатий
function fill(t){const L=prog.bf,n=spam.bigPresses;
  return t.replace('{code}',code(n)).replace('{code2}',code(n+1)).replace('{code3}',code(n+2)).replaceAll('{L}',L+1).replace('{need}',needFor(L))}
function rate(now){return ev.recent.filter(x=>now-x<2000).length/2}
/* какую ветку пытается открыть игрок: 'fast' — гонит темп, 'rhythm' — стучит ровно и неторопливо */
function stats(iv){const m=iv.reduce((a,b)=>a+b,0)/iv.length;return {m,cv:Math.sqrt(iv.reduce((a,b)=>a+(b-m)**2,0)/iv.length)/m}}
function intent(){
  const iv=spam.intervals.slice(-12);if(iv.length<8)return 'unknown';
  const {m,cv}=stats(iv),h=iv.length>>1,m1=stats(iv.slice(0,h)).m,m2=stats(iv.slice(h)).m;
  if(m<250||m2<m1*.85)return 'fast';          // очень быстро или разгоняется — это долбёжка
  if(m<=900&&cv<.15)return 'rhythm';          // неторопливо и ровно — это ритм
  return 'mixed';
}
function spamStep(now){
  if(now-spam.last>3000){Object.assign(spam,{stage:0,bigPresses:0,idx:0,intervals:[]});if(groove.state==='measure')stopGroove()}
  if(spam.last)spam.intervals.push(now-spam.last);if(spam.intervals.length>16)spam.intervals.shift();
  spam.last=now;const r=rate(now),it=intent();
  if(groove.state==='measure'&&it==='fast')stopGroove();          // начал гнать темп посреди замера — значит, не ритм
  // секрет «Ритм»: 12 неторопливых интервалов (250–900 мс) почти одинаковые
  if(!secrets.has('rhythm')&&it==='rhythm'&&spam.intervals.length>=12&&stats(spam.intervals.slice(-12)).cv<.1)
    return {fake:true,secret:'rhythm',fakeText:'О. ТЫ СТУЧИШЬ В РИТМ. ЭТО УЖЕ МУЗЫКА. ДЕРЖИ ЗЕЛЁНЫЙ.'};
  // грув: ритм уже открыт и игрок снова долбит примерно ровно — предлагаем замер, потом играем
  if(groove.state!=='off'){const g=grooveOnPress(spam.intervals[spam.intervals.length-1]||9999);if(g)return g;if(groove.state==='measure')return {big:true,text:'ЗАМЕРЯЮ… ДОЛБИ РОВНО.'}}
  else if(grooveUnlocked()){const g=spam.intervals.slice(-GROOVE_WARMUP);   // сначала игрок должен сам подолбить в ритме
    if(g.length===GROOVE_WARMUP){const m=g.reduce((a,b)=>a+b)/g.length,sd=Math.sqrt(g.reduce((a,b)=>a+(b-m)**2,0)/g.length);
      if(it==='rhythm'&&m>=250&&m<=900&&sd/m<.15)return offerGroove()}}
  if(it==='rhythm'&&spam.stage<2)return {text:secrets.has('rhythm')?'Ровно стучишь. Я слушаю… продолжай.':'Ровно стучишь. Я слушаю.'};
  if(spam.stage===0){if(ev.recent.length>=5){spam.stage=1;spam.baseRate=r;return {text:'Долбить быстрее тоже не помогает.'}}return null}
  if(spam.stage===1){
    if(it!=='rhythm'&&r>=3&&r>spam.baseRate*1.25){spam.stage=2;spam.bigStart=now;spam.bigPresses=0;spam.idx=0}
    else return {text:'Долбить быстрее тоже не помогает.'};
  }
  // секрет «Тормоз»: посреди долбёжки 4 медленных нажатия подряд (1,2–2,8 с)
  const iv4=spam.intervals.slice(-4);
  if(iv4.length===4&&iv4.every(x=>x>1200&&x<2800)&&!secrets.has('brake'))return {big:true,secret:'brake',text:'ЗАТОРМОЗИЛ? ПРОВЕРЯЕШЬ, СЛЕЖУ ЛИ Я. СЛЕЖУ.'};
  // посреди брут-форса перешёл на ровный стук — фраза замирает, ветка ритма получает шанс
  if(it==='rhythm'){const lay0=layer();if(lay0)return {text:fill(lay0.lines[spam.idx]),big:true,wait:spam.idx===lay0.lines.length-1}}
  const lay=layer();
  if(!lay){Object.assign(spam,{stage:0,bigPresses:0});return {fork:ARC[prog.bf].fork}}
  spam.bigPresses++;
  if(r>=2.5){
    if(spam.bigPresses>=needFor(prog.bf)&&now-spam.bigStart>12000){
      const t=fill(lay.fake);setProg('bf',prog.bf+1);Object.assign(spam,{stage:0,bigPresses:0,idx:0});
      return {fake:true,fakeText:t,layer:prog.bf}}
    const per=Math.max(4,Math.floor(needFor(prog.bf)/lay.lines.length));
    spam.idx=Math.min(lay.lines.length-1,Math.floor(spam.bigPresses/per));
  }
  const i=spam.idx;return {text:fill(lay.lines[i]),big:true,wait:i===lay.lines.length-1};
}

  const sec=new Date(now).getSeconds();out.push(`ты нажал на ${sec}-й секунде, а она ${sec%2?'нечётная':'чётная'}.`);

async function press(){
  const now0=performance.now();
  if(now0<lockUntil||!$('#choice').hidden)return;          // чекпоинт ещё читается / ждём выбора
  if(game.mode==='game')return gamePress(now0);
  const now=now0;ev.pressesSinceLoad++;ev.recent=ev.recent.filter(x=>now-x<10000);ev.recent.push(now);
  const ls=LS.get('emc_sig'),ck=CK.get('_ga_mc'),db=await IDB_get('sig');
  const any=ls||ck||db,sig=db||ls||ck;
  const s=await server('check');let kind='bad',text,big=false;
  const sp=s.known&&!s.fake&&any?spamStep(now):null;armWait(sp);

  if(!s.known){
    await server('register');s.list=[s.me,...(s.list||[])];
    await writeMarks(Math.random().toString(36).slice(2,10));
    kind='good';text='Ты зарегистрирован. Добро пожаловать в бесконечность.';
  }else if(s.fake){                       // в прошлый раз показали ненастоящий зелёный

    found('reveal');if(!s.uaSame)found('browser');
    text='Ага, в прошлый раз было зелёным, и ты подумал, что снова зарегистрировался. Но это был не тот зелёный. Я тебя не пропускаю, я тебя просто наебал! '+reason(s,Date.now());
  }else if(!any){                         // стёр всё, но IP тот же
    found('wipe');SS.set('emc_pressed','1');return fakeReg();
  }else if(ck&&(ls||db)&&ck!==(db||ls)){
    await writeMarks(db||ls);
    found('trap');text='Ууу, я смотрю, ты нашёл мою ловушку в кукис! Правильное ли это было значение? Нет.';
  }else if(!ls&&ck&&db){
    await writeMarks(sig);found('ls');text='Ага, ты почистил localStorage. А кука осталась — я всё видел.';
  }else if(!ck&&(ls||db)){
    await writeMarks(sig);found('cookie');text='Куку удалил? Хитро. Но я записал тебя ещё в паре мест.';
  }else if(!db&&ls&&ck){
    await writeMarks(sig);found('idb');text='IndexedDB подчистил? Мило. Кука и localStorage передают привет.';
  }else if(sp&&sp.fake){                 // додолбился — получи «регистрацию»
    found(sp.secret||'spamfake');layerSecret(sp);SS.set('emc_pressed','1');return fakeReg(sp.fakeText);
  }else if(sp&&sp.fork){
    return askFork(sp.fork);
  }else if(sp&&sp.big){
    found(sp.secret||'spamfast');text=sp.text;big=true;
  }else if(new Date().getHours()<5&&!secrets.has('night')){
    found('night');SS.set('emc_pressed','1');
    return fakeReg(prog.why===1?'ТЫ ПРИШЁЛ, КОГДА ВСЕ СПЯТ. ВОТ ОН — ТЁМНЫЙ ЗЕЛЁНЫЙ. ПОЧТИ НАСТОЯЩИЙ.':'ТЫ ПРИШЁЛ, КОГДА ВСЕ СПЯТ. ДЕРЖИ НОЧНОЙ ЗЕЛЁНЫЙ.');
  }else if(ev.otherTab){
    ev.otherTab=false;found('othertab');text='Вторая вкладка со мной не поможет. Я вижу обе.';
  }else if(ev.pressesSinceLoad===1&&nav==='reload'&&W0.ss){
    found('reload');text='Я видел, что ты обновил страницу. Нет, это не работает.';
  }else if(ev.pressesSinceLoad===1&&nav==='back_forward'){
    found('back');text='Кнопка «назад» тоже ничего не стирает.';
  }else if(ev.resized){

  }else if(ev.leftTab){

  }
  SS.set('emc_pressed','1');show(kind,text,s,big);
}

  for(const [cp,txt] of CHECKPOINTS)if(prev<cp&&n>=cp)return txt;
  const M=1e6;if(n>M&&Math.floor(prev/M)<Math.floor(n/M))return `${Math.floor(n/M)} МИЛЛИОНА. ЗЕЛЁНЫЙ ВСЁ ЕЩЁ НЕ ТОТ.`;

  $('#diarySub').textContent=`Открыто ${secrets.size} из ${SECRETS.length}. Тёмное — ещё не найдено.`;
  const ol=$('#diaryList');ol.innerHTML='';
  for(const [id,t,d] of SECRETS){const li=document.createElement('li');const on=secrets.has(id);li.className=on?'':'dark';
    li.innerHTML=`<b>${on?t:'█'.repeat(t.length)}</b><span>${on?d:'█'.repeat(Math.min(d.length,28))}</span>`;ol.append(li)}
}
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}
function found(id){
  if(secrets.has(id))return;const meta=SECRETS.find(x=>x[0]===id);if(!meta)return;
  secrets.add(id);server('secret',id);
  if(game.mode==='game'&&id!=='game')server('gamefake').then(sync);   // в игре каждый новый секрет — ещё один фейковый зелёный
  if(diaryShown){btnCount=secrets.size-1-flying;flying++;flyAchievement(meta[1])}
  drawDiary();
  maybeIntroDiary();
}
/* ачивка: выскакивает у куба, висит, потом с ускорением влетает в кнопку дневника */
function blip(){const a=AC();if(!a)return;const t=a.currentTime;
  [[1568,0,.06],[2349,.05,.04],[3136,.1,.025]].forEach(([f,dt,v])=>{const o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter();
    lp.type='lowpass';lp.frequency.value=3500;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t+dt);g.gain.linearRampToValueAtTime(v,t+dt+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t+dt+.45);o.connect(lp).connect(g).connect(a.destination);o.start(t+dt);o.stop(t+dt+.5)})}
function whoosh(){const a=AC();if(!a)return;const t=a.currentTime,len=.4,buf=a.createBuffer(1,a.sampleRate*len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const src=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();
  src.buffer=buf;bp.type='bandpass';bp.Q.value=1.2;bp.frequency.setValueAtTime(500,t);bp.frequency.exponentialRampToValueAtTime(5000,t+len);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+len*.85);g.gain.linearRampToValueAtTime(0,t+len);
  src.connect(bp).connect(g).connect(a.destination);src.start(t);src.stop(t+len)}
function flyAchievement(title){
  const el=document.createElement('div');el.className='achv';el.innerHTML='<small>НОВЫЙ СЕКРЕТ</small>'+title.toUpperCase();document.body.append(el);
  const cr=cube.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,x0=cr.left+cr.width/2-w/2,y0=cr.top-h-10;
  const pop=el.animate([{transform:`translate(${x0}px,${y0+30}px) scale(.4)`,opacity:0},{transform:`translate(${x0}px,${y0-6}px) scale(1.08)`,opacity:1,offset:.6},
    {transform:`translate(${x0}px,${y0}px) scale(1)`,opacity:1}],{duration:420,easing:'cubic-bezier(.2,1.4,.4,1)',fill:'forwards'});
  pop.onfinish=()=>setTimeout(()=>{
    const br=$('#diaryBtn').getBoundingClientRect(),x1=br.left+br.width/2-w/2,y1=br.top+br.height/2-h/2;
    whoosh();
    const fly=el.animate([{transform:`translate(${x0}px,${y0}px) scale(1) rotate(0)`,opacity:1},
      {transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-60}px) scale(.8) rotate(-6deg)`,opacity:1,offset:.45},
      {transform:`translate(${x1}px,${y1}px) scale(.15) rotate(8deg)`,opacity:.9}],
      {duration:620,easing:'cubic-bezier(.55,0,.9,.3)',fill:'forwards'});   // изинг с ускорением
    fly.onfinish=()=>{el.remove();impact(br)};
  },900);
}
function impact(br){
  flying=Math.max(0,flying-1);btnCount=flying?secrets.size-flying:null;drawDiary();
  const b=$('#diaryBtn');b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');blip();
  const cx0=br.left+br.width/2,cy0=br.top+br.height/2;
  for(let i=0;i<22;i++){const p=document.createElement('div');p.className='spark';document.body.append(p);
    const ang=Math.random()*Math.PI*2,dist=30+Math.random()*70,dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist+20,sz=.6+Math.random()*1.4;
    p.animate([{transform:`translate(${cx0}px,${cy0}px) scale(${sz})`,opacity:1},
      {transform:`translate(${cx0+dx*.7}px,${cy0+dy*.5}px) scale(${sz})`,opacity:1,offset:.5},
      {transform:`translate(${cx0+dx}px,${cy0+dy+25}px) scale(0)`,opacity:0}],
      {duration:500+Math.random()*400,easing:'cubic-bezier(.1,.8,.3,1)'}).onfinish=()=>p.remove()}
}
/* дневник вводится только когда открыты оба счётчика (PRESSES и FAKE GREENS) и найдено ≥ DIARY_AT секретов */
let diaryIntroPending=false;
function maybeIntroDiary(){
  if(diaryShown||diaryIntroPending||secrets.size<DIARY_AT||!(game.mode==='game'&&game.c2))return;
  diaryIntroPending=true;
  setTimeout(()=>{diaryIntroPending=false;typeOut('Кстати. Я веду дневник твоих секретов. Тёмные строчки ты ещё не нашёл.',true);revealDiaryBtn()},
    Math.max(0,lockUntil-performance.now())+2200);
}
function revealDiaryBtn(){
  diaryShown=true;const b=$('#diaryBtn');drawDiary();b.classList.remove('appear');void b.offsetWidth;b.classList.add('appear');chime();
  setTimeout(()=>b.classList.remove('appear'),2500);
}
function openDiary(){const d=$('#diary');drawDiary();d.classList.remove('closing');d.hidden=false;rustle(false)}
function closeDiary(){const d=$('#diary');if(d.hidden||d.classList.contains('closing'))return;d.classList.add('closing');rustle(true);
  setTimeout(()=>{d.hidden=true;d.classList.remove('closing')},290)}
$('#diaryBtn').onclick=openDiary;
$('#diary').onclick=e=>{if(e.target.id==='diary'||e.target.classList.contains('close'))closeDiary()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeDiary()});

function layerSecret(sp){if(sp.layer>=3)found('layer3');if(sp.layer>=5)found('layer5')}
function askFork(f){
  typeOut(f.q,true,true);lock(1200);
  setTimeout(()=>choose(f.a.map(([label,v])=>({label,fn:async()=>{setProg('why',v);found(v===1?'forkgreen':'forksound');
    typeOut(v===1?'ХОРОШО. ТОГДА ДОЛБИ ДАЛЬШЕ. Я РАССКАЖУ, ГДЕ ОН.':'ХОРОШО. ТОГДА СЛУШАЙ, ПОКА ДОЛБИШЬ.',true,true)}}))),1200);
}

/* секрет «подождать»: на фразе «ЛАДНО. ЛАДНО. ПОДОЖДИ…» — перестать жать и реально подождать */
const WAIT_MS=7000;let waitT;
function armWait(sp){
  clearTimeout(waitT);
  if(!(sp&&sp.wait))return;
  waitT=setTimeout(async()=>{
    if(performance.now()<lockUntil||!$('#choice').hidden)return;
    Object.assign(spam,{stage:0,bigPresses:0});ev.recent=[];found('wait');
    const t='ТЫ ПОДОЖДАЛ. ЭТО БЫЛО ТРУДНЕЕ, ЧЕМ ДОЛБИТЬ, ДА? ДЕРЖИ ЗЕЛЁНЫЙ.';
    if(game.mode==='game'){sync(await server('gamefake'));show('fake',t,null,true);lock(5000);maybeOfferC2()}
    else{SS.set('emc_pressed','1');await fakeReg(t)}
  },WAIT_MS);
}

/* фейковая рега вне игры: первая — обычный обман, со второй — вход в игру */
async function fakeReg(text){
  const st=await server('fake');sync(st);
  if(st.f<2){show('fake',text||'Ты зарегистрирован. Добро пожаловать в бесконечность.',st,!!text);lock(4500);return}
  show('fake','ТЫ ЗАРАБОТАЛ ВТОРОЙ НЕНАСТОЯЩИЙ ЗЕЛЁНЫЙ. ДОБРО ПОЖАЛОВАТЬ В ИГРУ.',st,true);lock(3500);
  setTimeout(()=>choose([
    {label:'Начать сначала',fn:async()=>{sync(await server('mode',null));typeOut('Как скажешь. Всё сначала.')}},
    {label:'Продолжить игру',fn:async()=>{sync(await server('mode','game'));found('game');typeOut('ИГРА НАЧАЛАСЬ. КАЖДОЕ НАЖАТИЕ НА СЧЕТУ.',true,true)}},
  ]),3500);
}

function show(kind,text,s,big){
  mood=kind;lastKind=kind;pressT=performance.now();groove.lastQ=null;play(kind);
  let glow=glowColor[kind],q=groove.lastQ;
  if(kind==='bad'&&q!=null){             // в груве: чем точнее нажатие — тем зеленее и ярче свет
    glow=`color-mix(in srgb,#5dff9a ${Math.round(q*100)}%,#c9a6ff)`;
    root.style.setProperty('--gq',(.6+q*1.2).toFixed(2));cube.classList.toggle('perfect',q>.85)}
  else{root.style.setProperty('--gq','1');cube.classList.remove('perfect')}
  root.style.setProperty('--glow',glow);
  cube.classList.remove('shake','on','bad');void cube.offsetWidth;cube.classList.add('shake','on');cube.classList.toggle('bad',kind==='bad');
  clearTimeout(offTimer);offTimer=setTimeout(()=>{cube.classList.remove('on','perfect');mood='idle'},kind==='bad'?700+(q!=null?q*900:0):4500);
  if(text!=null)typeOut(text,kind==='bad',big);if(s)render(s);
}
function render(s){if(s.admin)$('#reset').hidden=false;ul.innerHTML='';(s.list||[]).slice(0,200).forEach(h=>{const li=document.createElement('li');li.textContent=h.slice(0,40);if(h===s.me)li.className='me';ul.append(li)})}

/* ---------- e-mail ---------- */
const em=$('#email');let sentEmail='';
async function sendEmail(){
  const v=em.value.trim();if(!v||v===sentEmail)return;
  if(!em.checkValidity()){em.className='err';return}
  try{const r=await fetch('/api/endless/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v})});
    em.className=r.ok?'ok':'err';if(r.ok)sentEmail=v}catch{em.className='err'}
}
em.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendEmail();em.blur()}});
em.addEventListener('blur',sendEmail);
em.addEventListener('input',()=>em.className='');

$('#reset').addEventListener('click',async()=>{
  await fetch('/api/endless/reset',{method:'POST'}).catch(()=>{});
  try{localStorage.clear();sessionStorage.clear()}catch{}
  document.cookie='_ga_mc=;max-age=0;path=/';try{indexedDB.deleteDatabase('emc')}catch{}
  location.reload();
});
cube.addEventListener('click',press);
server('check').then(st=>{render(st);sync(st);(st.sec||[]).forEach(x=>secrets.add(x));diaryShown=secrets.size>=DIARY_AT&&st.mode==='game'&&!!st.c2;Object.assign(prog,st.prog||{});drawDiary();if(game.mode==='game')setTimeout(()=>typeOut('С ВОЗВРАЩЕНИЕМ В ИГРУ.',true,true),400)});
typeOut('Нажми на куб.');
</script>
