<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENDLESS MC SERVER</title>
<style>
:root{--top:#45237a;--mid:#1d0f33;--bot:#000;--rim:#5b2a9a;--teal:#2fd6d0;--txt:#a07ae0;--dim:#4f6b5d;
      --good:#5dff9a;--fake:#9ff06a;--bad:#ff5a3c;--glow:var(--rim)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;
  background:linear-gradient(180deg,var(--top) 0%,var(--mid) 55%,var(--bot) 100%)}
canvas#waves{position:fixed;inset:0;z-index:0;pointer-events:none}
main{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:1fr 280px}
#stage{position:relative;display:flex;align-items:center;justify-content:center}
#typed{position:absolute;left:4%;top:20%;max-width:280px;font-size:18px;line-height:1.35;transform:rotate(-2deg);
  white-space:pre-wrap;min-height:4em;text-shadow:0 0 8px #0006}
#typed.bad{color:#ff9d86}
#typed::after{content:"▌";animation:blink 1s steps(1) infinite;opacity:.7}
@keyframes blink{50%{opacity:0}}

#cubeHolder{position:relative;display:flex;flex-direction:column;align-items:center}
#cubeWrap{animation:levitate 12s ease-in-out infinite;position:relative;z-index:1}
@keyframes levitate{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(.5deg)}}
/* тень на подложке: не двигается вместе с кнопкой, а сжимается/бледнеет, когда кнопка взлетает */
#floorShadow{width:300px;height:46px;margin-top:-8px;border-radius:50%;
  background:radial-gradient(ellipse at center,#000c 0%,#0007 40%,transparent 72%);filter:blur(6px);
  animation:shadow 12s ease-in-out infinite;transition:background 1.2s}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(.8);opacity:.6}}
#cubeHolder.on #floorShadow{background:radial-gradient(ellipse at center,color-mix(in srgb,var(--glow) 45%,#000) 0%,#0007 45%,transparent 72%)}
#cube{position:relative;width:340px;height:396px;border:0;padding:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
#cube svg{width:100%;height:100%;overflow:visible;display:block}
#hole{transition:fill 1.2s}
#rim{transform-box:fill-box;transform-origin:center;transition:transform 1.4s cubic-bezier(.2,1.4,.4,1),stroke 1.2s,stroke-width 1.2s,filter 1.2s;
  stroke:var(--rim)}
#cube:hover #rim{transform:scale(1.03)}
#cube.on #rim{transform:scale(1.14);stroke:var(--glow);stroke-width:9;
  filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 0 22px var(--glow))}
#cube.on #hole{fill:url(#holeLit)}
#inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#inner img{position:absolute;width:62%;image-rendering:pixelated;opacity:.85}
.tag{position:relative;transform:rotate(-6deg);color:var(--teal);font-size:17px;line-height:1.35;text-align:left;
  letter-spacing:.04em;text-shadow:0 0 6px #2fd6d055}
.shake{animation:shake .8s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px) rotate(-2deg)}40%,60%{transform:translate(7px,-3px) rotate(2deg)}}

#list{border-left:2px solid var(--teal);padding:100px 14px 20px;overflow-y:auto;font-family:"Courier New",monospace;font-size:10px;color:var(--dim)}
#list h3{margin:0 0 14px;font-size:10px;letter-spacing:.3em;font-weight:normal;color:#8aa}
#list ul{margin:0;padding:0}
#list li{list-style:none;padding:2px 0;word-break:break-all}
#list li.me{color:var(--good)}
#email{position:fixed;bottom:18px;left:calc((100% - 280px)/2);transform:translateX(-50%);z-index:2;width:240px;background:transparent;
  border:1px solid #ffffff12;color:#aaa;padding:8px 10px;font:inherit;font-size:12px;outline:none}
#email:focus{border-color:#ffffff26}
#email::placeholder{color:#ffffff22}
@media (max-width:760px){main{grid-template-columns:1fr;grid-template-rows:1fr 150px}
  #list{border-left:0;border-top:2px solid var(--teal);padding-top:14px}#typed{top:6%;font-size:15px}#cube{width:240px;height:280px}#email{left:50%}}
</style>
</head>
<body>
<canvas id="waves"></canvas>
<main>
  <section id="stage">
    <div id="typed"></div>
    <div id="cubeHolder"><div id="cubeWrap"><button id="cube" aria-label="press">
      <svg viewBox="0 0 240 280">
        <defs>
          <!-- внутренняя тень выреза: размытая обводка, обрезанная по форме -->
          <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
          <clipPath id="clip"><path d="M120 12 L222 66 L222 214 L120 268 L18 214 L18 66 Z"/></clipPath>
          <linearGradient id="holeDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0616"/><stop offset="1" stop-color="#1c0f30"/></linearGradient>
          <radialGradient id="holeLit"><stop offset="0" stop-color="var(--glow)" stop-opacity=".35"/><stop offset="1" stop-color="#0c0616"/></radialGradient>
          <path id="hex" d="M120 12 L222 66 L222 214 L120 268 L18 214 L18 66 Z"/>
        </defs>
        <use id="hole" href="#hex" fill="url(#holeDark)"/>
        <use id="rim" href="#hex" fill="none" stroke-width="7" stroke-linejoin="round"/>
      </svg>
      <div id="inner">
        <img src="cube.png" alt="" onerror="this.remove()">
        <div class="tag">ENDLESS MC SERVER<br>ENDLESS DIRECTIONS<br>ENDLESS POSSIBILITIES</div>
      </div>
    </button></div><div id="floorShadow"></div></div>
  </section>
  <aside id="list"><h3>REGISTERED</h3><ul id="ul"></ul></aside>
</main>
<input id="email" type="email" placeholder="e-mail" autocomplete="email">

<script>
const API='/api/endless/press', SALT='endless-v1';
const $=s=>document.querySelector(s);
const cube=$('#cube'), typed=$('#typed'), ul=$('#ul'), root=document.documentElement;

async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---------- хранилища-ловушки ---------- */
const LS={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const SS={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}}};
const CK={get:k=>(document.cookie.match('(?:^|; )'+k+'=([^;]*)')||[])[1]||null,set:(k,v)=>document.cookie=`${k}=${v};max-age=31536000;path=/;SameSite=Lax`};
function idb(){return new Promise(r=>{try{const q=indexedDB.open('emc',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch{r(null)}})}
async function IDB_get(k){const d=await idb();if(!d)return null;return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null)})}
async function IDB_set(k,v){const d=await idb();if(d)d.transaction('kv','readwrite').objectStore('kv').put(v,k)}

/* ---------- сервер (мок, если API нет — например, открыли файл локально) ---------- */
async function server(action){
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
    if(!r.ok)throw 0;return await r.json();
  }catch{
    let ip=await IDB_get('mock_ip');if(!ip){ip=crypto.randomUUID();await IDB_set('mock_ip',ip)}
    const h=await sha(await sha(ip+SALT)+SALT);
    const list=JSON.parse(await IDB_get('mock_list')||'[]'),known=list.includes(h);
    if(action==='register'&&!known)list.unshift(h);
    await IDB_set('mock_list',JSON.stringify(list));
    return {known,me:h,list};
  }
}

/* ---------- звуки: свои файлы в ./sounds/ ---------- */
const snd={};
for(const n of ['good','fake','bad']){
  for(const ext of ['ogg','mp3','wav']){ // берётся первый найденный формат
    const a=new Audio(`sounds/${n}.${ext}`);a.preload='auto';
    a.addEventListener('canplaythrough',()=>{if(!snd[n])snd[n]=a},{once:true});
  }
}
function play(n){const a=snd[n];if(!a)return;const c=a.cloneNode();c.volume=n==='bad'?.9:.8;c.play().catch(()=>{})}

/* ---------- печать текста посимвольно ---------- */
let typeTimer;
function typeOut(text,bad){
  clearInterval(typeTimer);typed.textContent='';typed.className=bad?'bad':'';
  let i=0;typeTimer=setInterval(()=>{typed.textContent=text.slice(0,++i);if(i>=text.length)clearInterval(typeTimer)},bad?38:28);
}

/* ---------- волны ---------- */
const cv=$('#waves'),cx=cv.getContext('2d');let W,H;const fit=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};fit();addEventListener('resize',fit);
let pressT=-1e9,mood='idle',lastSpawn=0;const rings=[];
const colors={good:'93,255,154',fake:'159,240,106',bad:'255,90,60',idle:'120,70,200'};
function center(){const r=cube.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2]}
// контур выреза относительно центра (из viewBox 240x280), размер 128 = половина высоты
const HEX=[[0,-128],[102,-74],[102,74],[0,128],[-102,74],[-102,-74]];
const HEXPTS=(()=>{const p=[],n=40;for(let i=0;i<6;i++){const[a,b]=[HEX[i],HEX[(i+1)%6]];
  for(let j=0;j<n;j++){const u=j/n,x=a[0]+(b[0]-a[0])*u,y=a[1]+(b[1]-a[1])*u;p.push([x,y,Math.atan2(y,x)])}}return p})();
function frame(t){
  cx.clearRect(0,0,W,H);
  const since=(t-pressT)/1000,energy=Math.exp(-since/6);
  const every=since<12?(.3+since*.15)*1000:3200;
  if(t-lastSpawn>every){rings.push({born:t,mood,lobes:3+(Math.random()*4|0),seed:Math.random()*6});lastSpawn=t}
  const cr=cube.getBoundingClientRect(),x=cr.left+cr.width/2,y=cr.top+cr.height/2,unit=cr.height/280;
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i],age=(t-r.born)/1000;
    const sc=1.02+age*(.22+.5*energy);                 // во сколько раз волна больше выреза
    const alpha=Math.max(0,1-age/6)*(r.mood==='idle'?.2:.75);
    if(alpha<=0){rings.splice(i,1);continue}
    const dist=sc-1;                                   // насколько далеко отошла
    const amp=dist*(r.mood==='bad'?26:14)*(.4+energy);  // чем дальше — тем сильнее искажение
    const k=r.lobes+Math.floor(dist*3), ph=t/900+r.seed;
    cx.beginPath();
    for(const[px,py,th] of HEXPTS){
      let m=Math.sin(th*k+ph+age*2);
      if(r.mood==='bad')m*=Math.sin(th*17+ph*3);
      const s2=sc+amp*m/128;
      cx.lineTo(x+px*s2*unit,y+py*s2*unit);
    }
    cx.closePath();
    cx.strokeStyle=`rgba(${colors[r.mood]},${alpha})`;cx.lineWidth=r.mood==='bad'?1:2;cx.stroke();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- мета-игра ---------- */
const reasons=[
  'Причина сброса: твой хеш начинался не с той буквы.',
  'Причина сброса: ты нажал в нечётную секунду.',
  'Причина сброса: курсор вошёл в кнопку слева, а регистрация — только справа.',
  'Причина сброса: у тебя подозрительно честный часовой пояс.',
  'Причина сброса: мир сгенерировался с другим seed.',
  'Причина сброса: крипер.',
  'Причина сброса: ты слишком долго смотрел на волны.',
  'Причина сброса: кнопка устала.',
];
const isReload=performance.getEntriesByType('navigation')[0]?.type==='reload';
const glowColor={good:'#5dff9a',fake:'#9ff06a',bad:'#ff5a3c'};

async function press(){
  const st={ls:LS.get('emc_reg'),ss:SS.get('emc_seen'),ck:CK.get('_ga_mc'),sig:await IDB_get('sig'),fake:await IDB_get('fake')||LS.get('emc_fake')};
  const s=await server('check');let kind,text;
  if(!s.known){
    await server('register');s.list=[s.me,...(s.list||[])];
    const sig=Math.random().toString(36).slice(2,10);
    LS.set('emc_reg','1');CK.set('_ga_mc',sig);await IDB_set('sig',sig);
    kind='good';text='Ты зарегистрирован. Добро пожаловать в бесконечность.';
  }else if(st.fake){
    await IDB_set('fake',null);LS.set('emc_fake','');
    kind='bad';text='Ага, в прошлый раз было зелёным, и ты подумал, что снова зарегистрировался. Но это был не тот зелёный. Я тебя не пропускаю, я тебя просто наебал! '+reasons[Math.random()*reasons.length|0];
  }else if(st.ls){
    kind='bad';text=(isReload&&st.ss)?'Я видел, что ты обновил страницу. Нет, это не работает.':'Ты уже зарегистрировался, кнопка теперь нажимается хуже.';
  }else if(st.ck&&st.sig&&st.ck===st.sig){
    LS.set('emc_reg','1');kind='bad';text='Ага, а теперь ты обновился с очисткой кеша — я видел, как ты нажал кнопку.';
  }else if(st.ck&&st.ck!==st.sig){
    CK.set('_ga_mc',st.sig||'nope');LS.set('emc_reg','1');
    kind='bad';text='Ууу, я смотрю, ты нашёл мою ловушку в кукис, которая не чистилась после очистки кеша! Правильное ли это было значение?';
  }else{
    LS.set('emc_fake','1');await IDB_set('fake','1');
    kind='fake';text='Ты зарегистрирован. Добро пожаловать в бесконечность.';
  }
  SS.set('emc_seen','1');show(kind,text,s);
}

let offTimer;
function show(kind,text,s){
  mood=kind;pressT=performance.now();play(kind);
  root.style.setProperty('--glow',glowColor[kind]);
  cube.classList.remove('shake');void cube.offsetWidth;cube.classList.add('shake','on');$('#cubeHolder').classList.add('on');
  clearTimeout(offTimer);offTimer=setTimeout(()=>{cube.classList.remove('on');$('#cubeHolder').classList.remove('on');mood='idle'},kind==='bad'?3000:6000);
  typeOut(text,kind==='bad');render(s);
}
function render(s){ul.innerHTML='';(s.list||[]).slice(0,200).forEach(h=>{const li=document.createElement('li');li.textContent=h.slice(0,40);if(h===s.me)li.className='me';ul.append(li)})}

cube.addEventListener('click',press);
server('check').then(render);
typeOut('Нажми на куб.');
</script>
</body>
</html>
