# nginx перед nikita.os (сайт в Docker на 127.0.0.1:8000).
# Положить в /etc/nginx/conf.d/ вместо старого конфига, проверить: sudo nginx -t && sudo systemctl reload nginx
# Все таймауты — внутри server-блоков: так конфиг не конфликтует с настройками в nginx.conf.

# --- ограничения на один IP (зоны объявляются один раз) ---
limit_conn_zone $binary_remote_addr zone=nos_conn:10m;            # одновременные соединения
limit_req_zone  $binary_remote_addr zone=nos_req:10m rate=50r/s;  # запросы в секунду (с запасом: плейлист читает теги каждого трека)

server {
    listen 80;
    server_name _;

    # защита от медленных соединений (slowloris)
    client_header_timeout 10s;         # заголовки запроса — не дольше 10 с
    client_body_timeout   10s;
    send_timeout          30s;
    keepalive_timeout     30s;
    large_client_header_buffers 4 16k;
    server_tokens off;                 # не светим версию nginx

    location /.well-known/acme-challenge/ {
        root /var/www/invite;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;              # на nginx ≥1.25 можно писать: listen 443 ssl; http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/82.38.67.16/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/82.38.67.16/privkey.pem;

    # защита от медленных соединений (slowloris)
    client_header_timeout 10s;         # заголовки запроса — не дольше 10 с
    client_body_timeout   10s;
    send_timeout          30s;
    keepalive_timeout     30s;
    large_client_header_buffers 4 16k;
    server_tokens off;                 # не светим версию nginx

    client_max_body_size  64k;         # сайту большие тела запросов не нужны

    limit_conn nos_conn 50;            # не больше 50 соединений с одного адреса
    limit_req  zone=nos_req burst=200 nodelay;
    limit_conn_status 429;
    limit_req_status  429;

    # сжатие текстовых ответов (mp3 и картинки и так сжаты)
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # вебсокеты: чат (/api/chat/ws) и игра (/api/air/ws) — апгрейдим любой /api/*/ws
    location ~ ^/api/[a-z]+/ws$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;           # сервер шлёт ping каждые 25 с
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";        # keep-alive до сайта (вебсокет — отдельный location выше)
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
