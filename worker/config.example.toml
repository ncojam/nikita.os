# Конфиг домашнего воркера «Находок». Скопируй в ~/.config/nos-finds/config.toml

site = "https://82.38.67.16"   # адрес сайта
token = ""                     # тот же ключ, что NOS_FINDS_TOKEN на сервере
owner = ""                     # твой ник на сайте: твои плейлисты — первыми и с бо́льшим лимитом

minutes = 30                   # лимит времени обычного прогона
per_user = 60                  # разборов треков за прогон на одного пользователя
per_owner = 150                # … на владельца
sleep = 1.0                    # пауза между запросами к YouTube/SoundCloud, сек (меньше — риск капчи)
insecure = false               # true — не проверять сертификат сайта
proxy = ""                     # если YouTube/SoundCloud открываются только через VPN-клиент — его локальный
                               # прокси, например "socks5://127.0.0.1:2080" или "http://127.0.0.1:12334"
