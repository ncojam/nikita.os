# nikita.os в Docker.
#
# Вариант 1 — перед сайтом уже стоит nginx (как на сервере): поднимается только сайт,
# он слушает 127.0.0.1:8000 и снаружи напрямую недоступен.
#   docker compose up -d --build
#
# Вариант 2 — перед сайтом ничего нет: Caddy сам займёт порты 80/443 и сделает HTTPS.
#   docker compose --profile caddy up -d --build                       -> http://localhost
#   SITE_ADDRESS=nikita.example.com docker compose --profile caddy up -d --build   -> https://…
#
# Твои файлы — ./fs (подключаются только для чтения), счётчики прослушиваний — в томе plays.
# Без Docker всё так же работает ./run.sh.

services:
  app:
    build: .
    restart: unless-stopped        # сам поднимется после перезагрузки сервера
    environment:
      TRUST_PROXY: "1"            # адрес посетителя берём из X-Forwarded-For от nginx/Caddy
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}   # токен бота для Telegram Mini App «Джус» (ники из Телеги)
      NOS_FINDS_TOKEN: ${NOS_FINDS_TOKEN:-}   # ключ домашнего воркера «Находок» (пусто — API воркера выключен)
    volumes:
      - ./fs:/app/fs:ro           # сайт не может ничего изменить в твоих файлах
      - plays:/data
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"   # только для локального прокси, не в интернет
    read_only: true               # корневая ФС контейнера только для чтения
    tmpfs: ["/tmp:size=16m"]
    cap_drop: [ALL]               # никаких особых прав ядра
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    networks: [web]

  caddy:
    image: caddy:2.10-alpine
    profiles: [caddy]             # включается только с --profile caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # сертификаты
      - caddy_config:/config
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]   # только право слушать порты 80/443
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    networks: [web]

networks:
  web: {}

volumes:
  plays: {}
  caddy_data: {}
  caddy_config: {}
